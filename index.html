<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Программа больше не используется</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--ac:#e0a21a;--ok:#1a9b5a;--line:#dde1e6}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8ebef;--mu:#9aa5b1;--line:#2a313b;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
.ic{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(224,162,26,.16);font-size:32px}
h1{margin:0 0 10px;font-size:22px}
p{margin:0 0 10px;color:var(--mu);font-size:15px}
ul{list-style:none;margin:16px 0 4px;padding:0;text-align:left}
li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:15px}
li b{display:block;font-weight:600}
li span{display:block;color:var(--mu);font-size:13px}
li i{font-style:normal;flex:none;width:22px;text-align:center}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--ac);animation:mv 1.8s ease-in-out infinite}
@keyframes mv{0%{margin-left:-40%}100%{margin-left:100%}}
.safe{color:var(--ok);font-weight:600}
small{color:var(--mu);font-size:12.5px}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;margin-left:30%}}
</style>
<style>.ic.end{background:rgba(120,130,150,.18)} .end-h{margin-top:4px}</style>
</head>
<body>
<main class="box">
  <div class="ic end" aria-hidden="true">📦</div>
  <h1 class="end-h">Программа больше не используется</h1>
  <p>Работа с программой «Агроторг» завершена.<br>Спасибо всем за работу!</p>
  <p class="safe">Все данные сохранены.</p>
  <small>По вопросам обращайтесь к руководителю.</small>
</main>
<script>
/* убрать фоновую часть программы (push-уведомления) с телефона */
try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister() }) }) }catch(e){}
</script>
</body>
</html>
