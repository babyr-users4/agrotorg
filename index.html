<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<title>Агроторг (учёт Бабыра)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling column (max 640px), fixed 4-tab bar.
   Palette comes from the racking itself: rack-blue uprights as the accent, beam-orange for expiry warnings. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E5EAF1; --ink:#131A26; --muted:#58657A; --line:#D2D9E4;
  --accent:#1F4BC4; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB;
  --ok:#1B7A4B; --ok-bg:#DDF1E5; --warn:#A64F00; --warn-bg:#FFE8CC; --bad:#B3261E; --bad-bg:#FBE0DC;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --nav-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#161D28; --surface-2:#1E2735; --ink:#E9EEF6; --muted:#9AA7BB; --line:#2A3546;
    --accent:#7FA2FF; --accent-ink:#0A1226; --accent-soft:#1E2B4D;
    --ok:#62D49B; --ok-bg:#11301F; --warn:#FFB26B; --warn-bg:#3A2610; --bad:#FF9188; --bad-bg:#3C1815;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1E2735; --ink:#E9EEF6; --muted:#9AA7BB; --line:#2A3546;
  --accent:#7FA2FF; --accent-ink:#0A1226; --accent-soft:#1E2B4D;
  --ok:#62D49B; --ok-bg:#11301F; --warn:#FFB26B; --warn-bg:#3A2610; --bad:#FF9188; --bad-bg:#3C1815;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:640px;margin-inline:auto;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);border-top:3px solid var(--accent)}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg.i{width:20px;height:20px}
.brand{font:700 19px/1.1 var(--f-head);letter-spacing:.01em}
.brand small{display:block;font:400 12px/1.3 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:2px}
.brand small.ver{font-size:10.5px;margin-top:1px;opacity:.85}
.topr{display:flex;align-items:center;gap:10px}
@media (max-width:430px){.sync #syncTxt{display:none}.sync{gap:0}.sync .dot{width:10px;height:10px}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{display:block;padding-top:16px}
h1{font:700 26px/1.15 var(--f-head);margin:0 0 6px;text-wrap:balance}
h2{font:600 18px/1.2 var(--f-head);margin:0;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:60ch}
.lbl{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.group{margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stack{display:grid;gap:14px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.stat{padding:12px 12px 10px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:700 28px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.stat.warn b{color:var(--warn)}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:40px;font-weight:600;color:var(--muted);font-size:14px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* product block */
.prod{padding:0;overflow:hidden}
.prod-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 14px 10px}
.prod-h .tot{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prod-h .tot b{font:700 22px/1 var(--f-head);color:var(--ink)}
.btn-reset{background:none;border:0;margin:0;text-align:left;color:inherit;width:100%;cursor:pointer}
.prod-h.btn-reset{align-items:center;padding:14px;min-height:64px}
.prod-h .tot{display:flex;align-items:center;gap:6px}
.sub{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-weight:400}
.chev{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .15s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lot{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.lot-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dates{display:grid;gap:2px;font-size:13px;color:var(--muted);min-width:0}
.dates b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lot-qty{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.lot-qty b{font:700 24px/1 var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:500 13px/1.3 var(--f-mono);background:var(--bg);font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--muted)}
.chip.pick-chip{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);min-height:36px}
.empty{padding:14px;color:var(--muted);border-top:1px solid var(--line);font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.in{background:var(--accent-soft);color:var(--accent)}
/* cell rows */
.cellrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.cellrow:first-child{border-top:0}
.code{font:600 17px/1.2 var(--f-mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.what{min-width:0;display:grid;gap:6px;font-size:13px}
.what b{font-weight:600;overflow-wrap:anywhere}
.what small{display:block;color:var(--muted);font-size:12px}
.amt{text-align:right;font:700 20px/1 var(--f-head);font-variant-numeric:tabular-nums;min-width:56px}
.amt small{font:400 12px var(--f-body);color:var(--muted)}
.bar{height:5px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--ok)}
/* forms */
.choices{display:grid;gap:8px}
.choice{width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:10px}
.choice small{color:var(--muted);font-weight:400;white-space:nowrap}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field label .opt{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;min-width:0}
input.cellinp{font:600 24px/1 var(--f-mono);letter-spacing:.08em;text-align:center;min-height:58px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.note{font-size:13px;color:var(--muted);min-height:0}
.note:empty{display:none}
.note.bad{color:var(--bad)} .note.ok{color:var(--ok)} .note.warn{color:var(--warn)}
.note b{color:var(--ink)}
.btn{min-height:50px;padding:0 18px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.status.bad{background:var(--bad-bg);color:var(--bad)} .status.ok{background:var(--ok-bg);color:var(--ok)}
.progress{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.progress b{font-variant-numeric:tabular-nums}
/* out */
.pick{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pick .have{font-size:12px;color:var(--muted)}
.pick .have b{color:var(--ink);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.step button.all{width:auto;padding:0 10px;font-size:13px;font-weight:600}
.step input{width:54px;min-height:46px;text-align:center;padding:4px;font-weight:600;font-variant-numeric:tabular-nums}
.step input.on{border-color:var(--accent);background:var(--accent-soft)}
.autopick{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:14px}
.dock{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;display:grid;gap:10px;box-shadow:0 8px 28px rgba(8,16,40,.18)}
.dock .sum{font-size:14px;color:var(--muted)}
.dock .sum b{font:700 20px/1 var(--f-head);color:var(--ink)}
/* log */
.sumtxt{margin:0 0 6px;color:var(--muted);font-size:14px}
.sumtxt b{color:var(--ink);font-variant-numeric:tabular-nums}
.day{display:flex;justify-content:space-between;gap:10px;font:600 14px/1.2 var(--f-head);color:var(--muted);margin:18px 0 8px;font-variant-numeric:tabular-nums}
.day b{color:var(--ink)}
.mvlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mv{padding:12px 14px;display:grid;gap:4px}
.mv-h{display:flex;align-items:center;gap:10px}
.mv-h b{font:700 18px/1 var(--f-head);font-variant-numeric:tabular-nums}
.mv-h .when{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mv-b{font-size:14px;overflow-wrap:anywhere}
.mv-s{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-weight:500}
.mv-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;min-height:36px;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font:700 22px/1.2 var(--f-head);font-variant-numeric:tabular-nums}
.kv b.pos{color:var(--ok)} .kv b.neg{color:var(--warn)}
.lotline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.lotline b{font:700 18px/1 var(--f-head);white-space:nowrap;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.pgroup{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:10px}
.pgroup-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pgroup-h b:first-child{font-weight:600}
.pgroup-h b:last-child{font:700 20px/1 var(--f-head);white-space:nowrap}
.lotbox{display:grid;gap:3px;padding-left:10px;border-left:3px solid var(--accent-soft)}
/* banner / empty / toast */
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.hero-empty{padding:22px 18px;text-align:left;display:grid;gap:10px;justify-items:start}
.hero-empty p{margin:0;color:var(--muted);max-width:52ch}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.cc-lot{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-height:64px}
.cc-info{display:grid;gap:3px;min-width:0}
.cc-info b{font-weight:600;overflow-wrap:anywhere}
.cc-info small{color:var(--muted);font-size:12px}
.cc-info .pill{justify-self:start;margin-top:2px}
.cc-q{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.cc-q b{font:700 22px/1 var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.cc-lot svg{color:var(--muted)}
.tabs button{border:0;background:none;min-height:var(--nav-h);display:grid;justify-items:center;align-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 96px);z-index:40;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
#toast.bad{background:var(--bad);color:var(--surface)}
/* settings sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{max-width:640px;margin-inline:auto}
.sheet .bar-top{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.prow{display:grid;grid-template-columns:1fr 92px 66px;gap:8px;margin-bottom:8px}
.prow input{padding-inline:8px}
.chip .pc{font:600 12px/1.4 var(--f-body);padding:0 6px;border-radius:4px}
.pc.ok{background:var(--ok-bg);color:var(--ok)} .pc.warn{background:var(--warn-bg);color:var(--warn)} .pc.bad{background:var(--bad-bg);color:var(--bad)}
.bar.over i{background:var(--bad)}
.amt.over{color:var(--bad)}
.what .pill{justify-self:start;margin-top:3px}
.cityrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.cityrow button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.skel{height:120px;border-radius:10px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}#toast{transition:none}.chev{transition:none}}

/* v0.7: цвета срока и товаров, крупный режим, плотный список */
.pill.lv{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 62%,var(--ink));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 38%,transparent)}
.pc.lv{background:color-mix(in srgb,var(--c) 20%,var(--surface));color:color-mix(in srgb,var(--c) 62%,var(--ink))}
.pd{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--pc,var(--muted));margin-right:7px;flex:none}
.choice.pcol{border-left:7px solid var(--pc)}
.choice.pcol[aria-pressed="true"]{border-color:var(--accent);border-left-color:var(--pc)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:-4px 0 14px;align-items:center}
.legend span{display:inline-flex;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px}
.bigcode{font:700 34px/1.1 var(--f-mono);letter-spacing:.06em;text-align:center;padding:12px 10px;border-radius:10px;background:var(--accent-soft);margin:0 0 8px;font-variant-numeric:tabular-nums}
.bigcode.dim{opacity:.55}
.cc-act{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.cc-act .small{margin-left:auto}
.shrow{display:grid;grid-template-columns:52px 40px 84px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.shrow.one{grid-template-columns:52px 1fr}
input[type=color]{width:52px;height:44px;padding:2px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.prow{grid-template-columns:1fr 84px 60px 46px !important}
.prow input[type=color]{width:46px;padding:2px}
.uirow{margin-bottom:12px}
.uirow .small{margin-bottom:5px;display:block}
html[data-size="big"]{--nav-h:68px}
html[data-size="big"] .btn{min-height:58px;font-size:18px}
html[data-size="big"] .btn.sm{min-height:48px;font-size:16px}
html[data-size="big"] input[type=text],html[data-size="big"] input[type=number],html[data-size="big"] input[type=date],html[data-size="big"] select{min-height:56px;font-size:18px}
html[data-size="big"] .choice{min-height:62px;font-size:17px}
html[data-size="big"] .fchip{min-height:46px;font-size:16px}
html[data-size="big"] .seg button{min-height:48px;font-size:15px}
html[data-size="big"] .step button{width:50px;height:56px}

/* ---------- config & state ---------- */

    {id:'p1',name:'Карамель РАХАТ',short:'РАХАТ',cap:80,color:'#3B6FE0'},
    {id:'p2',name:'Карамель Алматинский Зазнайка',short:'Зазнайка',cap:80,color:'#B9449A'},
    {id:'p3',name:'Шоколад Казахстанский 3*2',short:'Шоколад 3*2',cap:108,color:'#8B5A2B'}
  ],
  cities:[], rows:[10,11,12,13], floors:[3,4,5,6], sections:92, capacity:80, maxLots:2, warnDays:30,
  shelf:[{min:50,color:'#1E9E5E'},{min:25,color:'#C79A00'},{min:10,color:'#E0701A'},{min:0,color:'#D32F2F'}],
  expiredColor:'#9B1C1C',
  title:'Агроторг (учёт Бабыра)', notice:{on:false,text:''}
};
var PALETTE=['#3B6FE0','#B9449A','#8B5A2B','#0E9AA7','#6B8E23','#7A57D1','#C2410C','#475569'];
function okColor(c,def){return (typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c))?c:def}
function normCfg(d){
  var c=clone(DEFAULTS); if(!d) return c;
  if(Array.isArray(d.products)&&d.products.length) c.products=d.products.map(function(p,i){
    var dp=DEFAULTS.products.filter(function(x){return x.id===String(p.id)})[0];
    var cap=Number.isFinite(p.cap)?p.cap:(dp?dp.cap:(Number.isFinite(d.capacity)?d.capacity:DEFAULTS.capacity));
    return {id:String(p.id),name:String(p.name||''),short:String(p.short||p.name||''),cap:cap,color:okColor(p.color,dp?dp.color:PALETTE[i%PALETTE.length])};
  });
  if(Array.isArray(d.shelf)&&d.shelf.length===4){
    var sh=d.shelf.map(function(x,i){return {min:i===3?0:Number(x.min),color:okColor(x.color,DEFAULTS.shelf[i].color)}});
    if(sh[0].min>sh[1].min&&sh[1].min>sh[2].min&&sh[2].min>0&&sh[0].min<=100) c.shelf=sh;
  }

var O={product:'',q:{},city:'',need:''};

/* ---------- derived stock ---------- */
function derive(list){
  var sorted=list.slice().sort(function(a,b){return String(a.ts||'').localeCompare(String(b.ts||''))||String(a.id).localeCompare(String(b.id))});
  var cells=new Map(), bad=[];
  sorted.forEach(function(m){
    if(!m.cell||!m.product) return;
    var q=Number(m.qty)||0, k=lotKey(m);
    var put=function(cell,delta){
      var cm=cells.get(cell); if(!cm){cm=new Map();cells.set(cell,cm)}
      var l=cm.get(k); if(!l){l={key:k,product:m.product,prod:m.prod,exp:m.exp,qty:0};cm.set(k,l)}
      l.qty+=delta;
    };
    if(m.type==='mv'){ if(!(q>0)||!m.to) return; put(m.cell,-q); put(m.to,q); }
    else if(m.type==='adj'){ if(!q) return; put(m.cell,q); }
    else { if(!(q>0)) return; put(m.cell,(m.type==='out'?-1:1)*q); }
  });
  var lots=new Map(), boxes=0;
  Array.from(cells.keys()).forEach(function(c){
    var cm=cells.get(c);
    Array.from(cm.keys()).forEach(function(k){
      var l=cm.get(k);
      if(l.qty===0){cm.delete(k);return}
      if(l.qty<0) bad.push(c);
      var g=lots.get(k); if(!g){g={key:k,product:l.product,prod:l.prod,exp:l.exp,qty:0,cells:[]};lots.set(k,g)}
      g.qty+=l.qty; g.cells.push({cell:c,qty:l.qty});
    });
    if(cm.size===0) cells.delete(c);
  });
  lots.forEach(function(g){g.cells.sort(function(a,b){return a.cell<b.cell?-1:1}); boxes+=g.qty});
  return {cells:cells,lots:lots,boxes:boxes,bad:bad};
}
function cellTotal(D2,code){var cm=D2.cells.get(code);var t=0;if(cm)cm.forEach(function(l){t+=l.qty});return t}
function problemCount(D2){
  var n=D2.bad.length;
  D2.cells.forEach(function(cm,c){
    var first=cm.values().next().value;
    if(first&&cellTotal(D2,c)>capOf(first.product)) n++;
    var ps={}; cm.forEach(function(l){ps[l.product]=1});
    if(Object.keys(ps).length>1) n++;
    if(cm.size>cfg.maxLots) n++;
  });
  return n;
}
var byExp=function(a,b){return a.exp<b.exp?-1:a.exp>b.exp?1:(a.prod<b.prod?-1:a.prod>b.prod?1:0)};

/* ---------- cell codes ---------- */
function fmtCellInput(v){
  var d=String(v).replace(/\D/g,'').slice(0,5);
  return d.slice(0,2)+(d.length>2?'-'+d.slice(2,4):'')+(d.length>4?'-'+d.slice(4):'');
}
function parseCell(text){
  var d=String(text).replace(/\D/g,'');
  if(d.length<5) return {state:'partial',digits:d};
  var row=+d.slice(0,2), sec=+d.slice(2,4), fl=+d[4];
  if(cfg.rows.indexOf(row)<0) return {state:'err',msg:'Ряда '+row+' нет. Ряды: '+cfg.rows.join(', ')};
  if(sec<1||sec>cfg.sections) return {state:'err',msg:'Секция '+pad(sec)+' вне диапазона 01–'+pad(cfg.sections)};
  if(cfg.floors.indexOf(fl)<0) return {state:'err',msg:'Этаж '+fl+' не используется под товар. Можно этажи: '+cfg.floors.join(', ')};
  return {state:'ok',code:pad(row)+'-'+pad(sec)+'-'+fl};
}
function describeCell(code){
  var cm=D.cells.get(code); if(!cm||!cm.size) return null;
  return Array.from(cm.values()).map(function(l){return product(l.product).name+' · произв. '+fmt(l.prod)+' · до '+fmt(l.exp)+' · осталось '+fp(lotInfo(l).pct)+'% · '+l.qty+' кор.'});
}

/* ---------- db helpers ---------- */
function canSave(){return dbState==='ok'&&!!db&&!!ME&&ME.role!=='viewer'}
function errText(e){
  var c=e&&e.code;
  if(c==='invalid_argument') return 'Нет права записи. Попросите владельца дать вам доступ «Участник» или выше.';
  if(c==='permission-denied') return 'Нет прав на это действие. Обратитесь к администратору.';
  if(c==='quota_exceeded') return 'Хранилище заполнено. Сообщите владельцу.';
  if(c==='resource_exhausted') return 'Слишком часто. Подождите секунду и повторите.';
  return 'Не удалось сохранить. Проверьте интернет и повторите.';
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function withRetry(fn){return fn().catch(function(e){ if(e&&e.code==='unavailable') return sleep(400+Math.random()*400).then(fn); throw e; })}
function addMove(m){var rec=Object.assign({},m,{ts:new Date().toISOString()},ME?{by:ME.uid,byName:ME.name,byLogin:ME.login}:{});return withRetry(function(){return db.collection('moves').add(rec)})}

function checkIn(){
  var r={cell:null,problems:[],lk:'',free:null,remaining:null,max:null,lotsIn:[],otherProd:[],thisQty:0,q:0};
  var hasLot=!!(F.product&&F.prod&&F.exp);
  if(hasLot) r.lk=F.product+'|'+F.prod+'|'+F.exp;
  var pc=parseCell(F.cell);
  if(pc.state==='ok'){
    r.cell=pc.code;
    var cm=D.cells.get(pc.code), tot=cellTotal(D,pc.code);
    r.cap=capOf(F.product||(cm&&cm.size?cm.values().next().value.product:''));
    r.free=r.cap-tot;
    r.lotsIn=cm?Array.from(cm.values()):[];
    r.otherProd=r.lotsIn.filter(function(l){return F.product&&l.product!==F.product});
    r.thisQty=hasLot&&cm&&cm.get(r.lk)?cm.get(r.lk).qty:0;
  }
  var tot2=Number(F.total)>0?Number(F.total):0;
  if(tot2) r.remaining=Math.max(0,tot2-F.placed);
  r.max=r.free!=null?Math.max(0,r.free):null;
  if(r.max!=null&&r.remaining!=null) r.max=Math.min(r.max,r.remaining);
  var q=Number(F.qty); r.q=q;
  var p=[];
  if(!F.product) p.push(['todo','Выберите товар']);
  else if(!F.prod) p.push(['todo','Укажите дату производства']);
  else if(!F.exp) p.push(['todo','Укажите срок годности']);
  else if(F.exp<=F.prod) p.push(['bad','Срок годности раньше даты производства']);
  else if(pc.state==='partial') p.push(['todo','Введите ячейку: 5 цифр (ряд, секция, этаж)']);
  else if(pc.state==='err') p.push(['bad',pc.msg]);
  else if(r.otherProd.length) p.push(['bad','Ячейка '+r.cell+' занята другим товаром. Выберите другую ячейку.']);
  else if(!r.thisQty&&r.lotsIn.length>=cfg.maxLots) p.push(['bad','В ячейке '+r.cell+' уже '+r.lotsIn.length+' партии с разными датами (максимум '+cfg.maxLots+'). Выберите другую ячейку.']);
  else if(!F.qty) p.push(['todo','Укажите количество коробок']);
  else if(!Number.isInteger(q)||q<1) p.push(['bad','Количество должно быть целым числом от 1']);
  else if(q>r.free) p.push(['bad','В ячейке '+r.cell+' свободно только '+r.free+' кор.']);
  r.problems=p; return r;
}

function updateIn(){
  if(tab!=='in') return;
  var r=checkIn();
  var sh=$('#inShelf');
  if(sh){
    if(F.prod&&F.exp&&F.exp>F.prod){
      var life=daysBetween(F.prod,F.exp), left=daysTo(F.exp);
      sh.className='note'+(left<0?' bad':left<=cfg.warnDays?' warn':'');
      var li0=lotInfo({prod:F.prod,exp:F.exp});
      sh.innerHTML='Срок годности <b>'+life+' дн.</b> · осталось <b>'+fp(li0.pct)+'%</b> ('+(left<0?'истёк '+(-left)+' дн. назад':left+' дн.')+')';
    }else{sh.className='note';sh.innerHTML=''}
  }
  var rm=$('#inRemain');
  if(rm){
    var t=Number(F.total);
    if(t>0){
      var done=Math.min(F.placed,t), left2=Math.max(0,t-F.placed);
      rm.innerHTML='<div class="progress"><div>Размещено <b>'+F.placed+'</b> из <b>'+t+'</b> · '+(left2?'осталось <b>'+left2+'</b>':'<b>вся поставка размещена</b>')+'</div><div class="bar'+(left2===0?' full':'')+'"><i style="width:'+Math.min(100,done/t*100)+'%"></i></div></div>';
    }else rm.innerHTML='';
  }
  var ch=$('#inCellHint');
  if(ch){
    var pc=parseCell(F.cell);
    if(pc.state==='ok'){
      var lines=describeCell(pc.code), tot=cellTotal(D,pc.code), free=Math.max(0,r.cap-tot);
      var BIG='<div class="bigcode">'+pc.code+'</div>';
      if(!lines){ch.className='note ok';ch.innerHTML=BIG+'Ячейка <b>'+pc.code+'</b> пустая, свободно '+r.cap+' кор.'+(F.product?'':' (лимит зависит от товара)')}
      else if(r.otherProd.length){ch.className='note bad';ch.innerHTML=BIG+'Занята другим товаром: '+lines.map(esc).join('; ')}
      else if(r.thisQty){ch.className='note ok';ch.innerHTML=BIG+'Здесь уже эта партия: <b>'+r.thisQty+'</b> кор.'+(r.lotsIn.length>1?' (всего в ячейке '+tot+')':'')+'. Свободно <b>'+free+'</b>'}
      else if(r.lotsIn.length>=cfg.maxLots){ch.className='note bad';ch.innerHTML=BIG+'Уже '+r.lotsIn.length+' партии с разными датами: '+lines.map(esc).join('; ')}
      else if(F.product&&F.prod&&F.exp){ch.className='note ok';ch.innerHTML=BIG+'Тот же товар с другими датами, будет '+(r.lotsIn.length+1)+' из '+cfg.maxLots+' партий. Свободно <b>'+free+'</b><br>'+lines.map(esc).join('<br>')}
      else{ch.className='note';ch.innerHTML=BIG+'В ячейке: '+lines.map(esc).join('; ')+'. Свободно <b>'+free+'</b>'}
    }else if(pc.state==='err'){ch.className='note bad';ch.textContent=pc.msg}
    else{ch.className='note';ch.textContent='Цифры без дефисов: 10013 превратится в 10-01-3.'}
  }
  var sg=$('#inSuggest');
  if(sg){
    var html='';
    if(F.product){
      var cp=capOf(F.product);
      var same=r.lk&&D.lots.get(r.lk)?D.lots.get(r.lk).cells.filter(function(c){return cp-cellTotal(D,c.cell)>0}):[];
      var sameSet={}; same.forEach(function(c){sameSet[c.cell]=1});
      var other=[];
      D.cells.forEach(function(cm,code){
        if(sameSet[code]) return;
        var ls=Array.from(cm.values());
        if(!ls.length||ls.some(function(l){return l.product!==F.product})) return;
        if(r.lk&&cm.get(r.lk)) return;
        if(ls.length>=cfg.maxLots) return;
        if(cp-cellTotal(D,code)<=0) return;
        other.push(code);
      });
      other.sort();
      var chip=function(code){return '<button type="button" class="chip pick-chip" data-act="inCell" data-cell="'+code+'">'+code+'<i>своб. '+(cp-cellTotal(D,code))+'</i></button>'};
      if(same.length) html+='<div class="note" style="margin-bottom:6px">Эта партия уже лежит здесь, есть место:</div><div class="chips">'+same.slice(0,12).map(function(c){return chip(c.cell)}).join('')+'</div>';
      else if(r.lk&&D.lots.get(r.lk)) html+='<div class="note">Все ячейки этой партии заполнены.</div>';
      if(other.length) html+='<div class="note" style="margin:10px 0 6px">Этот товар с другими датами, можно добавить вторую партию:</div><div class="chips">'+other.slice(0,12).map(chip).join('')+'</div>';
    }
    sg.innerHTML=html;
  }
  var st=$('#inStatus'), btn=$('#inBtn');
  if(st&&btn){
    var pr=r.problems[0], extra='';
    if(!pr&&r.remaining!=null&&r.q>r.remaining) extra=' Это больше, чем осталось разместить ('+r.remaining+').';

var DAY=864e5;
function periodRange(){

  if(S.period==='today') s=t; else if(S.period==='3') s=t-2*DAY; else if(S.period==='7') s=t-6*DAY; else if(S.period==='30') s=t-29*DAY;
  else if(S.period==='custom'){ if(S.from) s=toDate(S.from).getTime(); if(S.to) e=toDate(S.to).getTime()+DAY; }
  return [s,e];
}
function periodLabel(){
  switch(S.period){
    case 'today': return 'сегодня';
    case '3': return 'за 3 дня';
    case '7': return 'за 7 дней';
    case '30': return 'за 30 дней';
    case 'custom': return (S.from||S.to)?('с '+(S.from?fmt(S.from):'начала')+' по '+(S.to?fmt(S.to):'сегодня')):'за выбранный период';
    default: return 'за всё время';
  }
}
function kindOf(m){return m.type==='out'?'out':m.type==='mv'?'mv':m.type==='adj'?'adj':m.type==='plan'?'plan':'in'}
function periodMoves(type){
  var r=periodRange();
  return moves.filter(function(m){
    var k=kindOf(m);
    if(type==='misc'){ if(k!=='mv'&&k!=='adj') return false }
    else if(type&&k!==type) return false;
    if(S.pf!=='all'&&m.product!==S.pf) return false;
    if(S.who!=='all'&&(m.by||'')!==S.who) return false;
    if(r[0]==null&&r[1]==null) return true;
    var ts=Date.parse(m.ts); if(!isFinite(ts)) return false;

  });
}

/* ---------- ячейки: исправление ошибок приёмки ---------- */
var PENCIL='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
function lotCellsOf(key){var g=D.lots.get(key);return g?g.cells.map(function(c){return c.cell}):[]}
function cellIssue(D2,code){
  var cm=D2.cells.get(code); if(!cm) return '';
  var ps={}, neg=false; cm.forEach(function(l){ps[l.product]=1; if(l.qty<0) neg=true});
  if(neg) return 'В ячейке '+code+' получится отрицательный остаток. Сначала отмените отгрузки из неё в журнале.';
  if(Object.keys(ps).length>1) return 'В ячейке '+code+' окажутся разные товары';
  if(cm.size>cfg.maxLots) return 'В ячейке '+code+' будет больше '+cfg.maxLots+' партий с разными датами';
  var tot=cellTotal(D2,code), cap=capOf(cm.values().next().value.product);
  if(tot>cap) return 'В ячейке '+code+' получится '+tot+' кор., а лимит '+cap;
  return '';
}
/* Исправление правит исходные записи прихода: меняет товар и даты у всех записей партии в ячейке,
   а количество подгоняет по последним приходам. Первоначальные значения сохраняются в поле orig. */
function planEdit(ed){
  var res={ok:false,bad:false,msg:'',lines:[],patches:[],deletes:[]};
  var cm=D.cells.get(ed.cell), old=cm&&cm.get(ed.key);
  if(!old){res.bad=true;res.msg='Эта партия в ячейке изменилась. Закройте окно и откройте ячейку заново.';return res}
  if(!ed.product||!ed.prod||!ed.exp){res.msg='Укажите товар и обе даты';return res}
  if(ed.exp<=ed.prod){res.bad=true;res.msg='Срок годности раньше даты производства';return res}
  var q=Number(ed.qty);
  if(ed.qty===''||!Number.isInteger(q)||q<0){res.bad=true;res.msg='Количество: целое число от 0';return res}
  var nk=ed.product+'|'+ed.prod+'|'+ed.exp, relabel=nk!==ed.key;
  var newCell=ed.cell, cellChg=false;
  if(ed.to!==undefined&&ed.to!==ed.cell){
    var pcn=parseCell(ed.to);
    if(pcn.state==='partial'){res.msg='Введите ячейку: 5 цифр (ряд, секция, этаж)';return res}
    if(pcn.state==='err'){res.bad=true;res.msg=pcn.msg;return res}
    if(pcn.code!==ed.cell){newCell=pcn.code;cellChg=true}
  }
  if(cellChg&&relabel&&ed.scope==='lot'&&lotCellsOf(ed.key).length>1){res.msg='Чтобы сменить ячейку, выберите «Только здесь» в блоке про сроки';return res}
  var scope=[ed.cell];
  if(relabel&&ed.scope==='lot') lotCellsOf(ed.key).forEach(function(c){if(scope.indexOf(c)<0) scope.push(c)});
  var sim=moves.map(function(m){return Object.assign({},m)}), P={}, del={}, src=[], mvTo=[];
  sim.forEach(function(m){
    if(m.cell===ed.cell&&lotKey(m)===ed.key) src.push(m);
    if(m.type==='mv'&&m.to===ed.cell&&lotKey(m)===ed.key) mvTo.push(m);
    if(relabel&&(scope.indexOf(m.cell)>=0||(m.type==='mv'&&scope.indexOf(m.to)>=0))&&lotKey(m)===ed.key){
      var f=P[m.id]||(P[m.id]={}); f.product=ed.product; f.prod=ed.prod; f.exp=ed.exp;
      m.product=ed.product; m.prod=ed.prod; m.exp=ed.exp;
    }
  });
  if(cellChg){
    src.forEach(function(m){m.cell=newCell;(P[m.id]=P[m.id]||{}).cell=newCell});
    mvTo.forEach(function(m){m.to=newCell;(P[m.id]=P[m.id]||{}).to=newCell});
  }
  var diff=q-old.qty;
  if(diff!==0){
    var ins=src.filter(function(m){return (m.type==='in'||!m.type)&&m.qty>0}).sort(function(a,b){return String(b.ts||'').localeCompare(String(a.ts||''))});
    var NOIN='Эту партию нельзя поправить по приходу (она появилась перемещением или пересчётом). Количество исправьте кнопкой «Пересчитать» у ячейки.';
    if(!ins.length){res.bad=true;res.msg=NOIN;return res}
    if(diff>0){var m0=ins[0]; m0.qty+=diff; (P[m0.id]=P[m0.id]||{}).qty=m0.qty;}
    else{
      var rem=-diff;
      for(var i=0;i<ins.length&&rem>0;i++){
        var m1=ins[i], take=Math.min(rem,m1.qty);
        if(take===m1.qty){del[m1.id]=1;delete P[m1.id];m1.qty=0}
        else{m1.qty-=take;(P[m1.id]=P[m1.id]||{}).qty=m1.qty}
        rem-=take;
      }
      if(rem>0){res.bad=true;res.msg=NOIN;return res}
    }
  }
  var D2=derive(sim.filter(function(m){return !del[m.id]}));
  var byId={}; moves.forEach(function(m){byId[m.id]=m});
  var chk=scope.slice(); if(cellChg&&chk.indexOf(newCell)<0) chk.push(newCell);
  Object.keys(P).forEach(function(id){var m0=byId[id]; if(!m0) return; [m0.cell,m0.to].forEach(function(c){if(c&&chk.indexOf(c)<0) chk.push(c)})});
  for(var s=0;s<chk.length;s++){
    var issue=cellIssue(D2,chk[s]);
    if(issue){res.bad=true;res.msg=issue;return res}
  }
  Object.keys(P).forEach(function(id){
    if(del[id]) return;
    var m=byId[id], f=Object.assign({},P[id],{edited:true});
    if(!m.orig){f.orig={product:m.product,prod:m.prod,exp:m.exp,qty:m.qty,cell:m.cell}; if(m.to) f.orig.to=m.to}
    else if(f.cell!==undefined&&m.orig.cell===undefined) f.orig=Object.assign({},m.orig,{cell:m.cell});
    res.patches.push({id:id,fields:f});
  });
  res.deletes=Object.keys(del);
  if(!res.patches.length&&!res.deletes.length){res.msg='Измените хотя бы одно поле';return res}
  if(cellChg) res.lines.push('Ячейка: '+ed.cell+' → '+newCell+(cellDesc(newCell)?' (там уже: '+cellDesc(newCell)+')':''));
  if(ed.product!==old.product) res.lines.push('Товар: '+product(old.product).name+' → '+product(ed.product).name);
  if(ed.prod!==old.prod) res.lines.push('Произведено: '+fmt(old.prod)+' → '+fmt(ed.prod));
  if(ed.exp!==old.exp) res.lines.push('Годен до: '+fmt(old.exp)+' → '+fmt(ed.exp));
  if(q!==old.qty) res.lines.push('Количество: '+old.qty+' → '+q+' кор.'+(q===0?' (партия уйдёт из ячейки)':''));
  if(relabel&&scope.length>1) res.lines.push('Товар и сроки изменятся в ячейках: '+scope.join(', '));
  res.ok=true; return res;
}

function updateEdit(){
  if(!S.edit) return;
  var e=S.edit, pl=planEdit(e), st=$('#edStatus'), sv=$('#edSave'); if(!st||!sv) return;

  }
  var cp=$('#edCap'); if(cp) cp.textContent='Лимит ячейки для этого товара: '+capOf(e.product)+' кор.';

  else{st.className='status'+(pl.bad?' bad':'');st.textContent=pl.msg}

function applyEdit(){
  var pl=planEdit(S.edit); if(!pl.ok||busy||!canSave()) return;
  busy=true; updateEdit();
  var n=0, total=pl.patches.length+pl.deletes.length, stamp=new Date().toISOString(), ops=[];
  pl.patches.forEach(function(p){ops.push(function(){return withRetry(function(){return db.doc('moves/'+p.id).update(Object.assign({},p.fields,{editedAt:stamp,editedBy:ME?ME.uid:null,editedByName:ME?ME.name:null}))})})});
  pl.deletes.forEach(function(id){ops.push(function(){return withRetry(function(){return db.doc('moves/'+id).delete()})})});
  ops.reduce(function(pr,f){return pr.then(function(){return f().then(function(){n++})})},Promise.resolve()).then(function(){
    busy=false; S.edit=null; renderSheet(); render(); toast('Исправление сохранено');
  }).catch(function(e){
    busy=false; updateEdit();
    toast((n?'Выполнено '+n+' из '+total+'. ':'')+errText(e)+(n?' Откройте партию и повторите.':''),true);
  });
}

function mvOpen(c){
  var cm=D.cells.get(c); if(!cm||!cm.size) return toast('В ячейке уже ничего нет',true);
  var l=Array.from(cm.values()).sort(byExp)[0];
  S.mv={cell:c,key:l.key,qty:String(l.qty),to:''}; renderSheet(); updateMove();

function planMove(e){
  var r={ok:false,bad:false,msg:''};
  var cm=D.cells.get(e.cell), l=cm&&cm.get(e.key);
  if(!l){r.bad=true;r.msg='Партия в ячейке изменилась. Закройте окно и откройте заново.';return r}
  if(e.qty===''){r.msg='Укажите, сколько коробок переместить';return r}
  var q=Number(e.qty);
  if(!Number.isInteger(q)||q<1){r.bad=true;r.msg='Количество: целое число от 1';return r}
  if(q>l.qty){r.bad=true;r.msg='В ячейке только '+l.qty+' кор.';return r}
  var pc=parseCell(e.to);
  if(pc.state==='partial'){r.msg='Введите ячейку назначения: 5 цифр (ряд, секция, этаж)';return r}
  if(pc.state==='err'){r.bad=true;r.msg=pc.msg;return r}
  if(pc.code===e.cell){r.bad=true;r.msg='Это та же ячейка. Укажите другую.';return r}
  var dm=D.cells.get(pc.code), dl=dm?Array.from(dm.values()):[];
  if(dl.some(function(x){return x.product!==l.product})){r.bad=true;r.msg='Ячейка '+pc.code+' занята другим товаром.';return r}
  if(!(dm&&dm.get(e.key))&&dl.length>=cfg.maxLots){r.bad=true;r.msg='В ячейке '+pc.code+' уже '+dl.length+' партии с разными датами (максимум '+cfg.maxLots+').';return r}
  var cap=capOf(l.product), tot=cellTotal(D,pc.code);
  if(tot+q>cap){r.bad=true;r.msg='В ячейке '+pc.code+' свободно только '+Math.max(0,cap-tot)+' кор. (лимит '+cap+').';return r}
  r.ok=true; r.to=pc.code; r.q=q; r.lot=l;
  r.msg='Готово: '+q+' кор. '+e.cell+' → '+pc.code+(q===l.qty?'. Партия уйдёт из '+e.cell+' полностью.':'. В '+e.cell+' останется '+(l.qty-q)+' кор.');
  return r;
}
function renderMoveSheet(root){

  }).join('')+'</div></section>':(lots[0]?'<p class="lede">'+pdot(lots[0].product)+esc(product(lots[0].product).name)+' · произв. '+fmt(lots[0].prod)+' · до '+fmt(lots[0].exp)+' · сейчас '+lots[0].qty+' кор.</p>':'');

/* ---------- инвентаризация (пересчёт ячейки) ---------- */
function invOpen(c){
  var cm=D.cells.get(c); if(!cm||!cm.size) return toast('В ячейке уже ничего нет',true);
  var vals={}; cm.forEach(function(l){vals[l.key]=String(l.qty)});
  S.inv={cell:c,vals:vals}; renderSheet(); updateInv();
}
function planInv(e){
  var cm=D.cells.get(e.cell); if(!cm||!cm.size) return {ok:false,bad:true,msg:'В ячейке уже ничего нет. Закройте окно.'};
  var ch=[], lines=[], bad='', tot=0, prod='';
  cm.forEach(function(l){
    var raw=e.vals[l.key], v=Number(raw);
    if(raw===undefined||raw===''||!Number.isInteger(v)||v<0){bad='Фактическое количество: целое число от 0';return}
    tot+=v; prod=l.product;
    if(v!==l.qty){ch.push({l:l,now:v});var d=v-l.qty;lines.push(esc(product(l.product).short)+' · до '+fmt(l.exp)+': '+l.qty+' → <b>'+v+'</b> ('+(d>0?'+':'−')+Math.abs(d)+')')}
  });
  if(bad) return {ok:false,bad:true,msg:bad};
  var cap=capOf(prod), over=tot>cap?'<br>Внимание: больше лимита ячейки ('+cap+'). Ячейка будет отмечена как переполненная.':'';
  if(!ch.length) return {ok:true,ch:ch,html:'Всё совпадает с учётом. Ячейка будет отмечена как пересчитанная.'};
  return {ok:true,ch:ch,html:lines.join('<br>')+over};
}
function renderInvSheet(root){
  var e=S.inv, cm=D.cells.get(e.cell), lots=cm?Array.from(cm.values()).sort(byExp):[];
  root.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Пересчёт ячейки"><div class="wrap">'+
    '<div class="bar-top"><h1 style="margin:0;font-size:22px">Пересчёт ячейки</h1><button class="btn ghost sm" type="button" data-act="invClose">Закрыть</button></div>'+
    '<div class="bigcode">'+esc(e.cell)+'</div>'+
    '<p class="lede">Посчитайте коробки в ячейке и впишите, сколько их на самом деле. Расхождение запишется в журнал.</p>'+
    lots.map(function(l){
      var li=lotInfo(l);
      return '<section class="card prod" style="margin-bottom:12px"><div class="lot"><div class="lot-top"><div><b>'+pdot(l.product)+esc(product(l.product).name)+'</b>'+datesHtml(l)+'</div><div class="lot-qty">по учёту<br><b>'+l.qty+'</b> кор.</div></div>'+
        '<div><span class="pill lv"'+lvAttr(li)+'>'+(li.left<0?'срок истёк · 0%':'осталось '+fp(li.pct)+'% срока')+'</span></div>'+
        '<div class="field"><label>Фактически, коробок</label><div class="qrow"><input class="invin" type="number" inputmode="numeric" min="0" data-k="'+esc(l.key)+'" value="'+esc(e.vals[l.key])+'" aria-label="Фактически коробок"><button class="btn ghost" type="button" data-act="invSame" data-k="'+esc(l.key)+'">Как в учёте</button></div></div></div></section>';
    }).join('')+

function updateInv(){
  if(!S.inv) return;
  var p=planInv(S.inv), st=$('#invStatus'), sv=$('#invSave'); if(!st||!sv) return;
  st.className='status'+(p.bad?' bad':p.ok&&p.ch.length?' ok':'');

function applyInv(){
  var p=planInv(S.inv); if(!p.ok||busy||!canSave()) return;
  busy=true; updateInv();
  var cell=S.inv.cell, cm=D.cells.get(cell), recs=[];
  if(p.ch.length) p.ch.forEach(function(x){recs.push({type:'adj',product:x.l.product,prod:x.l.prod,exp:x.l.exp,cell:cell,qty:x.now-x.l.qty,prev:x.l.qty,now:x.now})});
  else{var f=Array.from(cm.values())[0]; recs.push({type:'adj',product:f.product,prod:f.prod,exp:f.exp,cell:cell,qty:0,prev:f.qty,now:f.qty})}
  var n=0;
  recs.reduce(function(pr,r){return pr.then(function(){return addMove(r).then(function(){n++})})},Promise.resolve()).then(function(){
    busy=false; S.inv=null; renderSheet(); render(); toast(p.ch.length?'Пересчёт записан: '+cell:'Ячейка '+cell+' пересчитана, всё совпало');

function mapTile(code,M){
  var cm=D.cells.get(code);
  if(!cm||!cm.size) return '<button type="button" class="mt empty" data-act="mapCell" data-cell="'+code+'" aria-label="Ячейка '+code+', пусто"></button>';
  var lots=Array.from(cm.values()), tot=cellTotal(D,code), p0=lots[0].product, cap=capOf(p0), f=Math.min(100,tot/cap*100), color;
  if(M.mode==='shelf'){var wl=lots.slice().sort(function(a,b){return lotInfo(a).pct-lotInfo(b).pct})[0]; color=lotInfo(wl).color}
  else if(M.mode==='fill') color=tot>cap?'var(--bad)':tot>=cap?'var(--ok)':'var(--accent)';
  else{var pp=cfg.products.filter(function(x){return x.id===p0})[0]; color=pp&&pp.color?pp.color:'#8A94A6'}
  var dim=M.pf!=='all'&&!lots.some(function(l){return l.product===M.pf});
  var bad=!!cellIssue(D,code);
  return '<button type="button" class="mt'+(dim?' dim':'')+(bad?' bad':'')+'" data-act="mapCell" data-cell="'+code+'" style="--c:'+color+';--f:'+f.toFixed(0)+'%" aria-label="Ячейка '+code+', '+tot+' из '+cap+' коробок"><i></i><b>'+tot+'</b>'+(lots.length>1?'<u>'+lots.length+'</u>':'')+'</button>';
}
function mapLegend(M){
  if(M.mode==='shelf') return legendHtml();

  return '<div class="legend">Цвет товара: '+cfg.products.map(function(p){return '<span><i style="--c:'+esc(p.color||'#8A94A6')+'"></i>'+esc(p.short)+'</span>'}).join('')+'</div>';
}
function renderMap(){
  var M=S.map; if(M.row==null||cfg.rows.indexOf(M.row)<0) M.row=cfg.rows[0];
  var per=10, nb=Math.ceil(cfg.sections/per); if(M.block>=nb) M.block=0;
  var floors=cfg.floors.slice().sort(function(a,b){return b-a});
  var s0=M.block*per+1, s1=Math.min(cfg.sections,s0+per-1), n=s1-s0+1;
  var rowCodes=0; D.cells.forEach(function(cm,c){if(c.slice(0,2)===String(M.row)) rowCodes++});
  var rowTotal=cfg.sections*floors.length, boxes=0; D.cells.forEach(function(cm,c){if(c.slice(0,2)===String(M.row)) boxes+=cellTotal(D,c)});
  var h='<div class="scrollrow">'+cfg.rows.map(function(r){return '<button class="fchip" type="button" data-act="mapRow" data-r="'+r+'" aria-pressed="'+(M.row===r)+'">Ряд '+r+'</button>'}).join('')+'</div>';
  h+='<div class="scrollrow">';
  for(var b=0;b<nb;b++){var a0=b*per+1,a1=Math.min(cfg.sections,a0+per-1);h+='<button class="fchip" type="button" data-act="mapBlock" data-b="'+b+'" aria-pressed="'+(M.block===b)+'">'+pad(a0)+'–'+pad(a1)+'</button>'}
  h+='</div>';
  h+='<div class="map" style="--n:'+n+'"><span></span>';
  for(var sc=s0;sc<=s1;sc++) h+='<span class="ml">'+pad(sc)+'</span>';
  floors.forEach(function(fl){
    h+='<span class="ml">'+fl+'</span>';

  });
  h+='</div>';
  h+='<div class="seg" role="group" aria-label="Раскраска">'+[['product','Товар'],['shelf','Срок'],['fill','Заполнение']].map(function(m){return '<button type="button" data-act="mapMode" data-m="'+m[0]+'" aria-pressed="'+(M.mode===m[0])+'">'+m[1]+'</button>'}).join('')+'</div>';
  h+='<div class="scrollrow"><button class="fchip" type="button" data-act="mapPf" data-id="all" aria-pressed="'+(M.pf==='all')+'">Все товары</button>'+cfg.products.map(function(p){return '<button class="fchip" type="button" data-act="mapPf" data-id="'+esc(p.id)+'" aria-pressed="'+(M.pf===p.id)+'">'+pdot(p.id)+esc(p.short)+'</button>'}).join('')+'</div>';
  h+='<p class="mapsum">Ряд '+M.row+': занято <b>'+rowCodes+'</b> из <b>'+rowTotal+'</b> ячеек · коробок <b>'+boxes+'</b>. Слева этажи, сверху номера секций.</p>';
  h+='<div class="mapcolor">'+mapLegend(M)+'</div>';
  h+='<p class="note">Нажмите на ячейку, чтобы увидеть, что в ней, или положить товар в пустую. Цифра в плитке — коробок, маленькая цифра в углу — сколько партий в ячейке, красная рамка — проблема в ячейке.</p>';
  return h;
}

/* ---------- ожидаемые приходы ---------- */
function plansOpen(){return moves.filter(function(m){return m.type==='plan'&&m.status==='open'}).sort(function(a,b){return String(a.eta||'9999').localeCompare(String(b.eta||'9999'))||tsAsc(a,b)})}
function setPlan(id,f){return withRetry(function(){return db.doc('moves/'+id).update(f)})}
function sourcesList(){var c={};moves.forEach(function(m){if(m.from) c[m.from]=(c[m.from]||0)+1});return Object.keys(c).sort(function(a,b){return c[b]-c[a]||(a<b?-1:1)})}
function srcDatalist(){return '<datalist id="srcList">'+sourcesList().map(function(x){return '<option value="'+esc(x)+'"></option>'}).join('')+'</datalist>'}
function etaText(eta){var d=daysTo(eta);return fmt(eta)+(d<0?' · опаздывает на '+(-d)+' дн.':d===0?' · сегодня':d===1?' · завтра':' · через '+d+' дн.')}
function planNoteHtml(){
  var pm=moves.filter(function(x){return x.id===F.planId})[0]; if(!pm) return '';
  return '<div class="status ok" style="margin-bottom:14px">Приём по ожидаемому приходу из «'+esc(pm.from||'не указано')+'»: '+Number(pm.qty)+' кор. Когда разместите всё, запись закроется сама.</div>';

function planCard(m){
  var q=Number(m.qty)||0;
  return '<section class="card prod"><div class="prod-h" style="align-items:flex-start"><div style="min-width:0"><h2>'+pdot(m.product)+esc(product(m.product).name)+'</h2>'+

function planBlockHtml(){

function planCheck(e){
  if(!e.product) return {msg:'Выберите товар'};
  var q=Number(e.qty); if(e.qty===''||!Number.isInteger(q)||q<1) return {msg:e.qty===''?'Укажите, сколько коробок ждёте':'Количество: целое число от 1',bad:e.qty!==''};
  if(!e.eta) return {msg:'Укажите ожидаемую дату прихода'};
  if(!e.from.trim()) return {msg:'Укажите, откуда придёт товар'};
  if((e.prod||e.exp)&&!(e.prod&&e.exp)) return {msg:'Укажите обе даты или не указывайте ни одной'};
  if(e.prod&&e.exp&&e.exp<=e.prod) return {msg:'Срок годности раньше даты производства',bad:true};
  return {ok:true,msg:'Готово: '+q+' кор. · '+product(e.product).short+' · '+fmt(e.eta)+' · '+e.from.trim()};
}

    '<section class="group"><div class="field"><label for="plFrom">Откуда приход</label><input id="plFrom" type="text" list="srcList" autocomplete="off" placeholder="завод, поставщик, склад" value="'+esc(e.from)+'">'+srcDatalist()+'</div>'+

function updatePlan(){
  if(!S.pl) return; var c=planCheck(S.pl), st=$('#plStatus'), sv=$('#plSave'); if(!st||!sv) return;
  st.className='status'+(c.ok?' ok':c.bad?' bad':''); st.textContent=c.msg;
  sv.disabled=!c.ok||busy||!canSave(); sv.textContent=busy?'Сохраняю…':'Добавить в ожидаемые';
}
function applyPlan(){
  var e=S.pl, c=planCheck(e); if(!c.ok||busy||!canSave()) return;
  var rec={type:'plan',status:'open',product:e.product,qty:Number(e.qty),eta:e.eta,from:e.from.trim()};
  if(e.prod&&e.exp){rec.prod=e.prod;rec.exp=e.exp} if(e.note.trim()) rec.note=e.note.trim();
  busy=true; updatePlan();
  addMove(rec).then(function(){busy=false;S.pl=null;S.plOpen=true;renderSheet();render();toast('Ожидаемый приход добавлен')})
    .catch(function(er){busy=false;updatePlan();toast(errText(er),true)});

/* PDF собирается прямо в программе: страницы рисуются как картинки и складываются в файл. Окно печати не нужно. */
var PG_W=794, PG_H=1123, PG_M=42;
function paginate(html){
  var CW=PG_W-2*PG_M, CH=PG_H-2*PG_M;
  var stage=document.createElement('div'); stage.style.cssText='position:fixed;left:-20000px;top:0;visibility:hidden;width:'+CW+'px';
  document.body.appendChild(stage);
  var src=document.createElement('div'); src.innerHTML=html;
  var pages=[], cur=null, lead=[];
  function newPage(){cur=document.createElement('div');cur.className='rpt pg';cur.style.width=CW+'px';stage.appendChild(cur);pages.push(cur)}
  function fits(){return cur.offsetHeight<=CH}
  function moveNew(nodes){nodes.forEach(function(n){if(n.parentNode)n.parentNode.removeChild(n)});newPage();nodes.forEach(function(n){cur.appendChild(n)})}
  function addTable(el){
    var thead=el.querySelector('thead'), rows=Array.prototype.slice.call(el.querySelectorAll('tbody tr')), foot=Array.prototype.slice.call(el.querySelectorAll('tfoot tr'));
    var mk=function(){var t=document.createElement('table');t.appendChild(thead.cloneNode(true));var tb=document.createElement('tbody');t.appendChild(tb);return {t:t,tb:tb,n:0}};
    var T=mk(); cur.appendChild(T.t);
    rows.concat(foot).forEach(function(r){
      var c=r.cloneNode(true); if(foot.indexOf(r)>=0) c.className='tf';
      T.tb.appendChild(c); T.n++;
      if(!fits()){
        T.tb.removeChild(c); T.n--;
        if(T.n===0){moveNew(lead.concat([T.t]));lead=[]}
        else{newPage();T=mk();cur.appendChild(T.t)}
        T.tb.appendChild(c); T.n++;
      }
    });
  }
  newPage();
  Array.prototype.slice.call(src.children).forEach(function(el){
    var tag=el.tagName;
    if(tag==='TABLE'){addTable(el);lead=[];return}
    var c=el.cloneNode(true); cur.appendChild(c);
    if(tag==='H2'||tag==='H3'){lead.push(c);return}
    if(!fits()&&cur.children.length>1) moveNew(lead.concat([c]));
    lead=[];
  });
  var out=pages.map(function(pg){var d=pg.cloneNode(true);d.style.width=CW+'px';return new XMLSerializer().serializeToString(d)});
  document.body.removeChild(stage);
  return out;
}
function pageJpeg(inner,idx,total){
  return new Promise(function(res,rej){
    var css=$('#rptCss').textContent;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+PG_W+'" height="'+PG_H+'"><foreignObject x="0" y="0" width="'+PG_W+'" height="'+PG_H+'"><div xmlns="http://www.w3.org/1999/xhtml" style="width:'+PG_W+'px;height:'+PG_H+'px;box-sizing:border-box;padding:'+PG_M+'px;background:#fff;overflow:hidden"><style>'+css+'</style>'+inner+'</div></foreignObject></svg>';
    var img=new Image();
    img.onload=function(){
      try{
        var k=2, cv=document.createElement('canvas'); cv.width=PG_W*k; cv.height=PG_H*k;
        var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img,0,0,cv.width,cv.height);
        cx.fillStyle='#555'; cx.font=(8.5*k)+'px Arial, sans-serif'; cx.textAlign='center';
        cx.fillText(cfg.title+' · Версия 0.11.5 · стр. '+idx+' из '+total,cv.width/2,cv.height-(20*k));
        cv.toBlob(function(b){
          if(!b) return rej(new Error('jpeg'));
          b.arrayBuffer().then(function(ab){res({bytes:new Uint8Array(ab),w:cv.width,h:cv.height})},rej);
        },'image/jpeg',0.85);
      }catch(e){rej(e)}
    };
    img.onerror=function(){rej(new Error('render'))};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function buildPdf(imgs){
  var chunks=[], len=0, offs={};
  var sb=function(t){var a=new Uint8Array(t.length);for(var q=0;q<t.length;q++)a[q]=t.charCodeAt(q)&255;return a};
  var put=function(x){var b=typeof x==='string'?sb(x):x;chunks.push(b);len+=b.length};
  var obj=function(id,body){offs[id]=len;put(id+' 0 obj\n'+body+'\nendobj\n')};
  var n=imgs.length, kids=[];
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  for(var a=0;a<n;a++) kids.push((3+3*a)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  imgs.forEach(function(im,i){
    var pid=3+3*i, cid=pid+1, iid=pid+2, cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>');
    obj(cid,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[iid]=len; put(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n'); put(im.bytes); put('\nendstream\nendobj\n');
  });
  var info=3+3*n; obj(info,'<< /Title (Agrotorg report) /Producer (Agrotorg 0.11.5) >>');
  var xr=len, t='xref\n0 '+(info+1)+'\n0000000000 65535 f \n';
  for(var id=1;id<=info;id++) t+=String(offs[id]).padStart(10,'0')+' 00000 n \n';
  put(t+'trailer\n<< /Size '+(info+1)+' /Root 1 0 R /Info '+info+' 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}
function saveBlob(blob,name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
}
function printFallback(html){
  var root=$('#printRoot'); root.className='rpt'; root.innerHTML=html;
  var back=function(){root.innerHTML='';window.removeEventListener('afterprint',back)};
  window.addEventListener('afterprint',back);
  setTimeout(function(){try{window.print()}catch(e){toast('Не удалось создать PDF',true)}},80);
}
function printReport(){
  var sec=S.rep.sec; if(!Object.keys(sec).some(function(k){return sec[k]})) return toast('Выберите хотя бы один раздел',true);
  if(busy) return;
  var html=reportHtml(sec), d=new Date();

  S.rep=null; renderSheet(); busy=true; toast('Готовлю PDF…');
  var pages;
  try{pages=paginate(html)}catch(e){busy=false;return printFallback(html)}
  pages.reduce(function(pr,inner,i){return pr.then(function(acc){return pageJpeg(inner,i+1,pages.length).then(function(j){acc.push(j);return acc})})},Promise.resolve([]))
    .then(function(imgs){var blob=buildPdf(imgs);saveBlob(blob,name);busy=false;toast('PDF сохранён в «Загрузки»: '+name+' ('+pages.length+' стр.)')})
    .catch(function(){busy=false;toast('Не удалось собрать PDF, открываю печать',true);printFallback(html)});
}

function parseList(s,min,max){
  var a=String(s).split(/[\s,;]+/).filter(Boolean).map(Number);
  if(!a.length||a.some(function(n){return !Number.isInteger(n)||n<min||n>max})) return null;
  return a.filter(function(n,i){return a.indexOf(n)===i}).sort(function(x,y){return x-y});
}
function saveSettings(){
  var d=S.draft, c=clone(cfg);
  var prods=d.products.map(function(p){return {id:p.id,name:p.name.trim(),short:(p.short||p.name).trim()||p.name.trim(),cap:Number(p.cap),color:okColor(p.color,'#8A94A6')}}).filter(function(p){return p.name});
  if(!prods.length) return toast('Нужен хотя бы один товар',true);
  if(prods.some(function(p){return !Number.isInteger(p.cap)||p.cap<1||p.cap>1000})) return toast('Лимит ячейки у каждого товара: целое число от 1 до 1000',true);
  var cap=Number(d.capacity), sec=Number(d.sections), warn=Number(d.warnDays), ml=Number(d.maxLots);
  if(!Number.isInteger(cap)||cap<1||cap>1000) return toast('Вместимость ячейки: целое число от 1 до 1000',true);
  if(!Number.isInteger(ml)||ml<1||ml>5) return toast('Партий в одной ячейке: от 1 до 5',true);
  if(!Number.isInteger(sec)||sec<1||sec>99) return toast('Секций в ряду: от 1 до 99',true);
  if(!Number.isInteger(warn)||warn<0||warn>3650) return toast('Предупреждение о сроке: число дней от 0',true);
  var rows=parseList(d.rows,10,99), floors=parseList(d.floors,1,9);
  if(!rows) return toast('Ряды: двузначные номера через запятую, например 10, 11, 12, 13',true);
  if(!floors) return toast('Этажи: цифры от 1 до 9 через запятую, например 3, 4, 5, 6',true);
  var sh=d.shelf.map(function(x,i){return {min:i===3?0:Number(x.min),color:x.color}});
  for(var si=0;si<3;si++){ if(!Number.isInteger(sh[si].min)||sh[si].min<1||sh[si].min>100) return toast('Порог цвета: целое число от 1 до 100',true); }
  if(!(sh[0].min>sh[1].min&&sh[1].min>sh[2].min)) return toast('Пороги цветов должны убывать, например 50, 25, 10',true);
  var tt=String(d.title||'').trim(); if(!tt) return toast('Название программы не может быть пустым',true);
  var nt=String(d.noticeText||'').trim(); if(d.noticeOn&&!nt) return toast('Введите текст объявления или выключите его',true);
  c.title=tt.slice(0,60); c.notice={on:!!d.noticeOn,text:nt.slice(0,2000)};
  c.shelf=sh; c.expiredColor=d.expiredColor;
  c.products=prods; c.cities=d.cities.slice(); c.capacity=cap; c.maxLots=ml; c.sections=sec; c.warnDays=warn; c.rows=rows; c.floors=floors;
  busy=true;
  saveCfg(c).then(function(){cfg=normCfg(c);S.settings=false;renderSheet();render();toast('Настройки сохранены')})
    .catch(function(e){toast(errText(e),true)}).then(function(){busy=false});
}

function saveIn(){
  var r=checkIn(); if(r.problems.length||busy||!canSave()) return;
  busy=true; updateIn();
  var rec={type:'in',product:F.product,prod:F.prod,exp:F.exp,cell:r.cell,qty:r.q}; if(F.from.trim()) rec.from=F.from.trim(); if(F.planId) rec.planId=F.planId;
  addMove(rec).then(function(){
    F.placed+=r.q; var c=r.cell; F.cell=''; F.qty='';
    toast('Принято '+r.q+' кор. → '+c);
    if(F.planId){var pm=moves.filter(function(x){return x.id===F.planId})[0]; if(pm&&F.placed>=Number(pm.qty)){setPlan(F.planId,{status:'received',receivedAt:new Date().toISOString()}).catch(function(){});F.planId=''}}
    busy=false; render(); var el=$('#inCell'); if(el) el.focus();
  }).catch(function(e){busy=false;updateIn();toast(errText(e),true)});
}
function saveOut(){
  var ls=outLines(); if(!ls.length||!O.city||busy||!canSave()) return;
  for(var i=0;i<ls.length;i++){
    var cm=D.cells.get(ls[i].cell), l=cm&&cm.get(ls[i].lk);
    if(!l||l.qty<ls[i].qty){toast('Остатки изменились. Проверьте список и повторите.',true);render();return}
  }
  busy=true; updateDock();
  var done=0, sum=0, city=O.city;
  ls.reduce(function(p,l){return p.then(function(){
    return addMove({type:'out',product:l.product,prod:l.prod,exp:l.exp,cell:l.cell,qty:l.qty,city:city}).then(function(){done++;sum+=l.qty});
  })},Promise.resolve()).then(function(){
    O.q={};O.need='';busy=false;toast('Отгружено '+sum+' кор. → '+city);render();
  }).catch(function(e){
    busy=false; O.q={}; render();
    toast((done?'Записано '+done+' из '+ls.length+' строк. ':'')+errText(e),true);
  });
}
function autoPick(){
  var need=Number(O.need); if(!(need>0)||!O.product) return toast('Введите, сколько коробок нужно отгрузить',true);
  var lots=Array.from(D.lots.values()).filter(function(l){return l.product===O.product}).sort(byExp);
  O.q={}; var left=need;
  lots.forEach(function(l){
    l.cells.slice().sort(function(a,b){return a.qty-b.qty}).forEach(function(c){
      if(left<=0) return; var t=Math.min(left,c.qty); O.q[c.cell+'#'+l.key]=t; left-=t;
    });
  });
  render();
  if(left>0) toast('На складе только '+(need-left)+' кор. из '+need,true);
}
function deleteMove(id){
  var sim=moves.filter(function(m){return m.id!==id});
  if(problemCount(derive(sim))>problemCount(D)){
    S.confirmDel=null; render();
    return toast('Нельзя отменить: после этого в ячейке получится минус, перебор или смесь товаров. Сначала отмените более поздние записи по этой ячейке.',true);
  }
  busy=true;
  withRetry(function(){return db.doc('moves/'+id).delete()}).then(function(){S.confirmDel=null;busy=false;toast('Запись отменена')})
    .catch(function(e){busy=false;toast(errText(e),true)});
}
function addCityTo(name,cb){
  name=name.trim(); if(!name) return;
  var ex=cfg.cities.filter(function(c){return c.toLowerCase()===name.toLowerCase()})[0];
  if(ex){O.city=ex;return cb(null,true)}
  var c=clone(cfg); c.cities.push(name);
  saveCfg(c).then(function(){cfg=normCfg(c);O.city=name;cb(null)}).catch(function(e){toast(errText(e),true)});
}

function staffAdd(){
  if(busy||!ME||ME.role!=='admin') return;
  var nm=gv('stName').trim(), l=gv('stLogin').trim().toLowerCase(), p=gv('stPass'), role=gv('stRole');
  if(!nm) return toast('Введите имя',true); if(!okLogin(l)) return toast('Логин: латиница, цифры, . _ - (2–30 знаков)',true); if(p.length<6) return toast('Пароль: минимум 6 знаков',true);
  if(USERS.some(function(u){return u.login===l})) return toast('Такой логин уже есть',true);
  busy=true;
  var app2; try{app2=firebase.app('adm')}catch(e){app2=firebase.initializeApp(FBCFG,'adm')}
  var a2=app2.auth(), mail=loginEmail(l);
  a2.createUserWithEmailAndPassword(mail,p).catch(function(e){
    if(e&&e.code==='auth/email-already-in-use') return a2.signInWithEmailAndPassword(mail,p);
    throw e;
  }).then(function(c){
    var uid=c.user.uid;
    return a2.signOut().then(function(){return FS.doc('users/'+uid).set({login:l,name:nm,role:role,active:true,created:new Date().toISOString(),createdBy:ME.uid})});

}

function impLoad(file){
  if(!ME||ME.role!=='admin') return;
  var r=new FileReader();
  r.onload=function(){
    var o;try{o=JSON.parse(r.result)}catch(e){return toast('Это не файл копии',true)}
    if(!o||o.app!=='agrotorg'||!Array.isArray(o.moves)) return toast('Это не файл копии «Агроторг»',true);
    if(!confirm('Добавить в общую базу '+o.moves.length+' записей из файла?\nСейчас в базе записей: '+moves.length+'.'+(moves.length?'\nЕсли вы уже загружали этот файл, записи не задублируются (у них те же номера).':'')+(o.config&&!moves.length?'\nНастройки тоже будут загружены из файла.':''))) return;
    busy=true; toast('Загружаю…');
    var ops=[]; var recs=o.moves.map(function(m){var id=m.id||String(Math.random()).slice(2,14);var c=Object.assign({},m);delete c.id;if(!c.by){c.by=ME.uid;c.byName='Перенос данных'}return {id:id,d:JSON.parse(JSON.stringify(c))}});
    for(var i=0;i<recs.length;i+=400) ops.push(recs.slice(i,i+400));
    ops.reduce(function(p,chunk){return p.then(function(){var b=FS.batch();chunk.forEach(function(x){b.set(FS.doc('moves/'+x.id),x.d)});return b.commit()})},Promise.resolve())
    .then(function(){ if(o.config&&!moves.length){return FS.doc('config/main').set(JSON.parse(JSON.stringify(normCfg(o.config))))} })
    .then(function(){toast('Загружено записей: '+recs.length)}).catch(function(e){toast(errText(e),true)}).then(function(){busy=false});
  };
  r.readAsText(file);
}

try{var a0=JSON.parse(localStorage.getItem(LS_AU2)||'null'); if(a0){AUTO2.on=a0.on!==false; if([3,7,14].indexOf(a0.days)>=0) AUTO2.days=a0.days}}catch(e){}

function pad2(n){return (n<10?'0':'')+n}
function whenText(iso){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d)) return '';
  var now=new Date(), t=pad2(d.getHours())+':'+pad2(d.getMinutes());
  var dk=function(x){return x.getFullYear()*10000+x.getMonth()*100+x.getDate()};
  var y=new Date(now); y.setDate(y.getDate()-1);
  if(dk(d)===dk(now)) return 'сегодня в '+t;
  if(dk(d)===dk(y)) return 'вчера в '+t;
  return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear()+' в '+t;
}
function presHtml(u){

}

/* ---- уведомления о чужих действиях ---- */
var KNOWN=null, NQ=[], NT=null;
function notifyNew(first){
  if(first||!KNOWN){
    KNOWN={}; var back=[], ps=ME&&ME.prevSeen?Date.parse(ME.prevSeen):0;
    var since=Math.max(Date.now()-7*86400000, isFinite(ps)&&ps?ps:Date.now()-86400000);
    moves.forEach(function(m){
      KNOWN[m.id]=1;
      if(!ME||!m.by||m.by===ME.uid) return;
      var k=kindOf(m); if(k!=='in'&&k!=='out') return;
      var t=Date.parse(m.ts); if(isFinite(t)&&t>since) back.push(m);
    });
    if(back.length&&UI.notif!=='0'){NQ=back; flushNotif(true)}
    return;
  }
  var fresh=[];
  moves.forEach(function(m){
    if(KNOWN[m.id]) return; KNOWN[m.id]=1;
    if(!ME||!m.by||m.by===ME.uid) return;
    var k=kindOf(m); if(k!=='in'&&k!=='out') return;
    var t=Date.parse(m.ts); if(!isFinite(t)||Date.now()-t>600000) return;
    fresh.push(m);
  });
  if(!fresh.length||UI.notif==='0') return;
  NQ=NQ.concat(fresh); clearTimeout(NT); NT=setTimeout(flushNotif,1800);
}
function flushNotif(backlog){
  var g={}, order=[];
  NQ.forEach(function(m){
    var k=[m.by,kindOf(m),m.product,kindOf(m)==='out'?m.city:m.from].join('|');
    if(!g[k]){g[k]={m:m,cells:{},sum:0,last:m.ts};order.push(k)}
    var o=g[k], q=Number(m.qty)||0; o.sum+=q; o.cells[m.cell]=(o.cells[m.cell]||0)+q; if(String(m.ts)>String(o.last)) o.last=m.ts;
  });
  NQ=[];
  order.sort(function(a,b){return String(g[b].last).localeCompare(String(g[a].last))});
  var extra=0;
  if(backlog&&order.length>4){extra=order.length-3; order=order.slice(0,3)}
  order.forEach(function(k){
    var o=g[k], m=o.m, out=kindOf(m)==='out';
    var cells=Object.keys(o.cells).sort().map(function(c){return c+' ('+o.cells[c]+')'}).join(', ');
    var who=m.byLogin||m.byName||'сотрудник';
    showNf(backlog?o.last:'', backlog, 'Сотрудник «'+who+'» '+(out?'отгрузил':'принял приход')+' '+o.sum+' кор. · '+product(m.product).short+(out?' → '+(m.city||'?')+'. Из ячеек: ':'. В ячейки: ')+cells);
  });
  if(extra) showNf('',true,'Ещё '+extra+' действий других сотрудников за время вашего отсутствия. Подробности в журнале.');
}
function showNf(whenIso,sticky,txt){
  var r=document.getElementById('nfRoot'); if(!r) return;
  var hd=document.querySelector('.top'); r.style.top=(hd?Math.max(0,Math.round(hd.getBoundingClientRect().bottom))+6:8)+'px';
  var d=document.createElement('div'); d.className='nf'; d.setAttribute('role','status');
  var t=new Date(), hm=whenIso?whenText(whenIso):pad(t.getHours())+':'+pad(t.getMinutes());
  d.innerHTML='<span class="nf-t">'+esc(txt)+'</span><span class="nf-w">'+hm+'</span><button type="button" data-act="nfClose" aria-label="Закрыть уведомление">×</button>';
  r.appendChild(d);
  while(r.children.length>5) r.removeChild(r.firstChild);
  try{if(navigator.vibrate) navigator.vibrate(120)}catch(e){}
  setTimeout(function(){if(d.parentNode) d.parentNode.removeChild(d)},sticky?45000:20000);
}

  root.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Новая ячейка с товаром"><div class="wrap">'+
    '<div class="bar-top"><h1 style="margin:0;font-size:22px">Новая ячейка с товаром</h1><button class="btn ghost sm" type="button" data-act="ncClose">Закрыть</button></div>'+
    '<p class="lede">Добавьте товар, который уже лежит в ячейке, но ещё не записан в программе. В журнале запись появится в разделе «Прочее» с пометкой «добавлено вручную». Новую поставку лучше вносить на вкладке «Приход».</p>'+
    '<section class="group"><h2 class="lbl">Товар</h2><div class="choices">'+cfg.products.map(function(p){return '<button type="button" class="choice pcol"'+pcol(p.id)+' data-act="ncProduct" data-id="'+esc(p.id)+'" aria-pressed="'+(e.product===p.id)+'"><span>'+esc(p.name)+'</span></button>'}).join('')+'</div></section>'+
    '<section class="group"><div class="two"><div class="field"><label for="ncProd">Дата производства</label><input id="ncProd" type="date" value="'+esc(e.prod)+'"></div><div class="field"><label for="ncExp">Годен до</label><input id="ncExp" type="date" value="'+esc(e.exp)+'"></div></div><div id="ncShelf" class="note" style="margin-top:8px"></div></section>'+
    '<section class="group"><div class="field"><label for="ncCell">Ячейка: ряд-секция-этаж</label><input id="ncCell" class="cellinp" type="text" inputmode="numeric" autocomplete="off" placeholder="10-01-3" value="'+esc(e.cell)+'"></div><div id="ncHint" class="note" style="margin-top:8px"></div></section>'+
    '<section class="group"><div class="field"><label for="ncQty">Сколько коробок в ячейке</label><input id="ncQty" type="number" inputmode="numeric" min="1" value="'+esc(e.qty)+'"></div></section>'+
    '<div class="stack"><div id="ncStatus" class="status"></div><button id="ncSave" class="btn" type="button" data-act="ncSave">Добавить в ячейку</button></div></div></div>';
}
function updateNc(){
  if(!S.nc) return;
  var e=S.nc, r=checkNew(e), st=document.getElementById('ncStatus'), sv=document.getElementById('ncSave'); if(!st||!sv) return;
  var sh=document.getElementById('ncShelf');
  if(sh){
    if(e.prod&&e.exp&&e.exp>e.prod){var li=lotInfo({prod:e.prod,exp:e.exp});sh.className='note'+(li.cls==='ok'?'':' '+li.cls);sh.innerHTML='Срок годности <b>'+li.life+' дн.</b> · осталось <b>'+fp(li.pct)+'%</b>'}
    else{sh.className='note';sh.innerHTML=''}
  }
  var ch=document.getElementById('ncHint');
  if(ch){
    var pc=parseCell(e.cell);
    if(pc.state==='ok'){
      var lines=describeCell(pc.code);
      ch.className='note'+(r.otherProd.length?' bad':' ok');
      ch.innerHTML=lines?'В ячейке <b>'+pc.code+'</b> уже: '+lines.map(esc).join('; ')+'. Свободно <b>'+Math.max(0,r.free)+'</b>':'Ячейка <b>'+pc.code+'</b> пустая, свободно '+r.cap+' кор.';
    }else if(pc.state==='err'){ch.className='note bad';ch.textContent=pc.msg}
    else{ch.className='note';ch.textContent='Цифры без дефисов: 10013 превратится в 10-01-3.'}
  }
  if(r.problems.length){var p0=r.problems[0]; st.className='status'+(p0[0]==='bad'?' bad':''); st.textContent=p0[1]; sv.disabled=true}
  else{st.className='status ok'; st.textContent='Будет добавлено '+r.q+' кор. в ячейку '+r.cell; sv.disabled=busy||!canSave()}
  sv.textContent=busy?'Сохраняю…':'Добавить в ячейку';
}
function saveNc(){
  var e=S.nc, r=checkNew(e); if(!e||r.problems.length||busy||!canSave()) return;
  busy=true; updateNc();
  var prev=r.thisQty;
  addMove({type:'adj',manual:true,product:e.product,prod:e.prod,exp:e.exp,cell:r.cell,qty:r.q,prev:prev,now:prev+r.q}).then(function(){
    busy=false; S.nc=null; renderSheet(); render(); toast('Добавлено '+r.q+' кор. → '+r.cell);
  }).catch(function(er){busy=false;updateNc();toast(errText(er),true)});
}

function isToday(m){return m.ts&&dayKey(m.ts)===dayKey(new Date().toISOString())}
function tdCls(m){var k=kindOf(m); return (k==='out'||k==='in')&&isToday(m)?' td-'+k:''}
function tdTag(m){var k=kindOf(m); if(!((k==='out'||k==='in')&&isToday(m))) return ''; return '<span class="tdtag">'+(k==='out'?'Сегодняшняя отгрузка':'Сегодняшний приход')+'</span>'}

function calcDef(){return {prod:'',exp:'',months:''}}
function addMonthsIso(iso,n){
  var p=iso.split('-').map(Number), d0=new Date(p[0],p[1]-1+n,1);
  var last=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate(); d0.setDate(Math.min(p[2],last));
  return d0.getFullYear()+'-'+pad(d0.getMonth()+1)+'-'+pad(d0.getDate());
}
function renderCalcSheet(root){
  var c=S.calc;
  root.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Калькулятор срока"><div class="wrap">'+
    '<div class="bar-top"><h1 style="margin:0;font-size:22px">Калькулятор срока</h1><button class="btn ghost sm" type="button" data-act="calcClose">Закрыть</button></div>'+
    '<p class="lede">Введите дату производства и срок годности: покажу общий срок, сколько прошло и сколько осталось, в днях и процентах.</p>'+
    '<section class="group"><div class="two"><div class="field"><label for="calcProd">Дата производства</label><input id="calcProd" type="date" value="'+esc(c.prod)+'"></div><div class="field"><label for="calcExp">Годен до</label><input id="calcExp" type="date" value="'+esc(c.exp)+'"></div></div>'+
    '<div class="field" style="margin-top:12px"><label for="calcMonths">Или срок годности в месяцах <span class="opt">если даты «годен до» нет</span></label><input id="calcMonths" type="number" inputmode="numeric" min="1" max="120" placeholder="например 9" value="'+esc(c.months)+'"></div></section>'+
    '<div id="calcOut" class="calcres"></div></div></div>';
}
function updateCalc(){
  var out=document.getElementById('calcOut'); if(!S.calc||!out) return;
  var c=S.calc, exp=c.exp, from='';
  var mo=Number(c.months);
  if(!exp&&c.prod&&mo>=1&&Number.isInteger(mo)&&mo<=120){exp=addMonthsIso(c.prod,mo); from='Годен до по сроку '+mo+' мес.: <b>'+fmt(exp)+'</b>'}
  if(!c.prod||!exp){out.innerHTML='<p class="note">Укажите дату производства и срок годности (дату «годен до» или число месяцев).</p>';return}
  if(exp<=c.prod){out.innerHTML='<div class="status bad">Срок годности раньше даты производства или равен ей.</div>';return}
  var life=daysBetween(c.prod,exp), left=daysTo(exp), passed=-daysTo(c.prod);
  var li=lotInfo({prod:c.prod,exp:exp}), exact=Math.max(0,Math.min(100,left/life*100)), fx=function(v){return v.toFixed(1).replace('.',',')};
  var mon=(life/30.4375).toFixed(1).replace('.',',');
  var h=(from?'<p class="sumtxt">'+from+'</p>':'');
  h+='<div class="stats"><div class="stat"><b>'+life+'</b><span>дн. общий срок (≈ '+mon+' мес.)</span></div>'+
     '<div class="stat"><b>'+Math.max(0,Math.min(life,passed))+'</b><span>дн. прошло · '+(passed<0?'0':fx(Math.max(0,Math.min(100,passed/life*100))))+'%</span></div>'+
     '<div class="stat'+(left<0?' warn':'')+'"><b>'+Math.max(0,left)+'</b><span>дн. осталось · '+fx(exact)+'%</span></div></div>';
  h+='<p class="sumtxt"><span class="pill lv"'+lvAttr(li)+'>'+(left<0?'Срок истёк '+(-left)+' дн. назад · 0%':'Остаточный срок '+fp(li.pct)+'%')+'</span></p>';
  if(passed<0) h+='<p class="note">Партия ещё не произведена: до даты производства '+(-passed)+' дн.</p>';
  h+='<div class="bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,exact))+'%"></i></div><p class="note" style="margin-top:8px">Остаточный срок считается как доля оставшихся дней от общего срока и показывается с точностью до 0,1%.</p>';
  out.innerHTML=h;
}
function boot(){
  if(BAKED_CFG) return startFirebase(BAKED_CFG);
  var raw=null; try{raw=localStorage.getItem(LS_FB)}catch(e){}
  if(raw){try{return startFirebase(JSON.parse(raw))}catch(e){}}
  fetch('/__/firebase/init.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){if(!o||!o.apiKey)throw 0;startFirebase(o)}).catch(function(){screenConfig()});
}
boot();
})();
</script>
