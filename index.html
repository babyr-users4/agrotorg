/* Layout: phone-first app shell. Sticky header, one scrolling column (max 640px), fixed 4-tab bar.
   Palette comes from the racking itself: rack-blue uprights as the accent, beam-orange for expiry warnings. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E5EAF1; --ink:#131A26; --muted:#58657A; --line:#D2D9E4;
  --accent:#1F4BC4; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB;
  --ok:#1B7A4B; --ok-bg:#DDF1E5; --warn:#A64F00; --warn-bg:#FFE8CC; --bad:#B3261E; --bad-bg:#FBE0DC;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --nav-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#161D28; --surface-2:#1E2735; --ink:#E9EEF6; --muted:#9AA7BB; --line:#2A3546;
    --accent:#7FA2FF; --accent-ink:#0A1226; --accent-soft:#1E2B4D;
    --ok:#62D49B; --ok-bg:#11301F; --warn:#FFB26B; --warn-bg:#3A2610; --bad:#FF9188; --bad-bg:#3C1815;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1E2735; --ink:#E9EEF6; --muted:#9AA7BB; --line:#2A3546;
  --accent:#7FA2FF; --accent-ink:#0A1226; --accent-soft:#1E2B4D;
  --ok:#62D49B; --ok-bg:#11301F; --warn:#FFB26B; --warn-bg:#3A2610; --bad:#FF9188; --bad-bg:#3C1815;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:640px;margin-inline:auto;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);border-top:3px solid var(--accent)}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg.i{width:20px;height:20px}
.brand{font:700 19px/1.1 var(--f-head);letter-spacing:.01em}
.brand small{display:block;font:400 12px/1.3 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:2px}
.brand small.ver{font-size:10.5px;margin-top:1px;opacity:.85}
.topr{display:flex;align-items:center;gap:10px}
@media (max-width:430px){.sync #syncTxt{display:none}.sync{gap:0}.sync .dot{width:10px;height:10px}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{display:block;padding-top:16px}
h1{font:700 26px/1.15 var(--f-head);margin:0 0 6px;text-wrap:balance}
h2{font:600 18px/1.2 var(--f-head);margin:0;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:60ch}
.lbl{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.group{margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stack{display:grid;gap:14px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.stat{padding:12px 12px 10px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:700 28px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.stat.warn b{color:var(--warn)}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:40px;font-weight:600;color:var(--muted);font-size:14px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* product block */
.prod{padding:0;overflow:hidden}
.prod-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 14px 10px}
.prod-h .tot{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prod-h .tot b{font:700 22px/1 var(--f-head);color:var(--ink)}
.btn-reset{background:none;border:0;margin:0;text-align:left;color:inherit;width:100%;cursor:pointer}
.prod-h.btn-reset{align-items:center;padding:14px;min-height:64px}
.prod-h .tot{display:flex;align-items:center;gap:6px}
.sub{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-weight:400}
.chev{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .15s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lot{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.lot-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dates{display:grid;gap:2px;font-size:15px;color:var(--ink);min-width:0}
.mv-h .cellchip{font-size:16px}
.mv-s b{font-variant-numeric:tabular-nums}
.dates b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lot-qty{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.lot-qty b{font:700 24px/1 var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:500 13px/1.3 var(--f-mono);background:var(--bg);font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--muted)}
.chip.pick-chip{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);min-height:36px}
.empty{padding:14px;color:var(--muted);border-top:1px solid var(--line);font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.in{background:var(--accent-soft);color:var(--accent)}
/* cell rows */
.cellrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.cellrow:first-child{border-top:0}
.code{font:600 17px/1.2 var(--f-mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.what{min-width:0;display:grid;gap:6px;font-size:13px}
.what b{font-weight:600;overflow-wrap:anywhere}
.what small{display:block;color:var(--muted);font-size:12px}
.amt{text-align:right;font:700 20px/1 var(--f-head);font-variant-numeric:tabular-nums;min-width:56px}
.amt small{font:400 12px var(--f-body);color:var(--muted)}
.bar{height:5px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--ok)}
/* forms */
.choices{display:grid;gap:8px}
.choice{width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:10px}
.choice small{color:var(--muted);font-weight:400;white-space:nowrap}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field label .opt{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;min-width:0}
input.cellinp{font:600 24px/1 var(--f-mono);letter-spacing:.08em;text-align:center;min-height:58px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.note{font-size:13px;color:var(--muted);min-height:0}
.note:empty{display:none}
.note.bad{color:var(--bad)} .note.ok{color:var(--ok)} .note.warn{color:var(--warn)}
.note b{color:var(--ink)}
.btn{min-height:50px;padding:0 18px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.status.bad{background:var(--bad-bg);color:var(--bad)} .status.ok{background:var(--ok-bg);color:var(--ok)}
.progress{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.progress b{font-variant-numeric:tabular-nums}
/* out */
.pick{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pick .have{font-size:12px;color:var(--muted)}
.pick .have b{color:var(--ink);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.step button.all{width:auto;padding:0 10px;font-size:13px;font-weight:600}
.step input{width:54px;min-height:46px;text-align:center;padding:4px;font-weight:600;font-variant-numeric:tabular-nums}
.step input.on{border-color:var(--accent);background:var(--accent-soft)}
.autopick{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:14px}
.dock{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;display:grid;gap:10px;box-shadow:0 8px 28px rgba(8,16,40,.18)}
.dock .sum{font-size:14px;color:var(--muted)}
.dock .sum b{font:700 20px/1 var(--f-head);color:var(--ink)}
/* log */
.sumtxt{margin:0 0 6px;color:var(--muted);font-size:14px}
.sumtxt b{color:var(--ink);font-variant-numeric:tabular-nums}
.day{display:flex;justify-content:space-between;gap:10px;font:600 14px/1.2 var(--f-head);color:var(--muted);margin:18px 0 8px;font-variant-numeric:tabular-nums}
.day b{color:var(--ink)}
.mvlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mv{padding:12px 14px;display:grid;gap:4px}
.mv-h{display:flex;align-items:center;gap:10px}
.mv-h b{font:700 18px/1 var(--f-head);font-variant-numeric:tabular-nums}
.mv-h .when{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mv-b{font-size:14px;overflow-wrap:anywhere}
.mv-s{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-weight:500}
.mv-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.mv-a4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mv-a4 button{border:1px solid var(--line);background:transparent;color:var(--accent);font-weight:700;font-size:13px;min-height:38px;padding:6px 2px;border-radius:10px}
.mv-a4 button.bad{color:var(--bad)}
.ie{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.btn.wo{color:var(--bad)}
.hk-wo{background:var(--bad-bg);color:var(--bad)}
.loghint{margin:8px 2px 12px;color:var(--muted);font-size:13px}
.fbar{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.fsum{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;min-height:44px;text-align:left}
.fsum span{color:var(--muted);font-size:13px}
.fsum b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.fsum.on{border-color:var(--accent)}
.fsum.on b{color:var(--accent)}
.fpanel{margin-bottom:4px}
.seg button[data-act="stockView"]{min-height:46px;font-size:15px;padding:0 14px}
.seg:has([data-act="stockView"]){margin-left:-6px;margin-right:-6px}
.mv-a .btn.sm[data-act="dsCopy"],.mv-a .btn.sm[data-act="dsShare"]{min-width:150px;flex:1 1 150px}
.fpanel .chiprow{gap:5px;margin-bottom:8px}
.fpanel .chiprow{flex-wrap:nowrap;gap:4px}
.fpanel .fchip,html[data-size] .fpanel .fchip{flex:1 1 auto;min-width:0;min-height:38px!important;padding:0 6px!important;font-size:14px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpanel .fchip .pdot{display:none}
html .fpanel .fchip[data-act=pf],html[data-size] .fpanel .fchip[data-act=pf],html .fpanel .fchip[data-act=who],html[data-size] .fpanel .fchip[data-act=who]{font-size:12px!important;padding:0 2px!important;flex:1 1 auto;overflow:visible;text-overflow:clip}
.fpanel .two{margin-bottom:8px;gap:8px}
.fpanel .field label{font-size:12px;margin-bottom:2px}
.fpanel input[type=date]{min-height:38px;padding:4px 8px}
.fbar{margin-bottom:6px}
#warnRoot{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.wbox{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;display:grid;gap:12px}
.wbox .wic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(224,162,26,.18);font-size:26px;justify-self:center}
.wbox h2{margin:0;font-size:22px;text-align:center}
.wbox .wl{margin:0 0 8px;font-size:16px;font-weight:700;line-height:1.4}
.wbox ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.45;color:var(--ink)}
.wbox .btn{width:100%;min-height:50px;font-size:16px}
.wbox .btn:disabled{opacity:.55}
.wbar{height:4px;border-radius:3px;background:var(--line);overflow:hidden}.wbar i{display:block;height:100%;width:0;background:#e0a21a}
html body .dayb.dtoday{background:rgba(22,194,94,.08);border:1px solid rgba(22,194,94,.35);box-shadow:inset 4px 0 0 rgba(22,194,94,.55);border-radius:12px;padding:10px 12px;color:var(--ink)}

html body .mvc .mv-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}

.dscard{padding:0;margin-bottom:10px;overflow:hidden}
.dshead{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;background:var(--surface);border:0;color:var(--ink);font-size:16px;text-align:left}

function derive(list){
  var sorted=list.slice().sort(function(a,b){return String(a.ts||'').localeCompare(String(b.ts||''))||String(a.id).localeCompare(String(b.id))});
  var cells=new Map(), bad=[];
  sorted.forEach(function(m){
    if(!m.cell||!m.product) return;
    var q=Number(m.qty)||0, k=lotKey(m);
    var put=function(cell,delta){
      var cm=cells.get(cell); if(!cm){cm=new Map();cells.set(cell,cm)}
      var l=cm.get(k); if(!l){l={key:k,product:m.product,prod:m.prod,exp:m.exp,qty:0};cm.set(k,l)}
      l.qty+=delta;
    };
    if(m.type==='mv'){ if(!(q>0)||!m.to) return; put(m.cell,-q); put(m.to,q); }
    else if(m.type==='adj'){ if(!q) return; put(m.cell,q); }
    else { if(!(q>0)) return; put(m.cell,(m.type==='out'?-1:1)*q); }
  });
  var lots=new Map(), boxes=0;
  Array.from(cells.keys()).forEach(function(c){
    var cm=cells.get(c);
    Array.from(cm.keys()).forEach(function(k){
      var l=cm.get(k);
      if(l.qty===0){cm.delete(k);return}
      if(l.qty<0) bad.push(c);
      var g=lots.get(k); if(!g){g={key:k,product:l.product,prod:l.prod,exp:l.exp,qty:0,cells:[]};lots.set(k,g)}
      g.qty+=l.qty; g.cells.push({cell:c,qty:l.qty});
    });
    if(cm.size===0) cells.delete(c);
  });
  lots.forEach(function(g){g.cells.sort(function(a,b){return a.cell<b.cell?-1:1}); boxes+=g.qty});

function checkIn(){
  var r={cell:null,problems:[],lk:'',free:null,remaining:null,max:null,lotsIn:[],otherProd:[],thisQty:0,q:0};
  var hasLot=!!(F.product&&F.prod&&F.exp);
  if(hasLot) r.lk=F.product+'|'+F.prod+'|'+F.exp;
  var pc=parseCell(F.cell);
  if(pc.state==='ok'){
    r.cell=pc.code;
    var cm=D.cells.get(pc.code), tot=cellTotal(D,pc.code);
    r.cap=capOf(F.product||(cm&&cm.size?cm.values().next().value.product:''));
    r.free=r.cap-tot;
    r.lotsIn=cm?Array.from(cm.values()):[];
    r.otherProd=r.lotsIn.filter(function(l){return F.product&&l.product!==F.product});
    r.thisQty=hasLot&&cm&&cm.get(r.lk)?cm.get(r.lk).qty:0;
  }
  var tot2=Number(F.total)>0?Number(F.total):0;
  if(tot2) r.remaining=Math.max(0,tot2-F.placed);
  r.max=r.free!=null?Math.max(0,r.free):null;
  if(r.max!=null&&r.remaining!=null) r.max=Math.min(r.max,r.remaining);
  var q=Number(F.qty); r.q=q;
  var p=[];
  if(!F.product) p.push(['todo','Выберите товар']);
  else if(!F.prod) p.push(['todo','Укажите дату производства']);
  else if(!F.exp) p.push(['todo','Укажите срок годности']);
  else if(F.exp<=F.prod) p.push(['bad','Срок годности раньше даты производства']);
  else if(!F.noFrom&&!String(F.from||'').trim()) p.push(['todo','Укажите, откуда пришло']);
  else if(pc.state==='partial') p.push(['todo','Введите ячейку: 5 цифр (ряд, секция, этаж)']);
  else if(pc.state==='err') p.push(['bad',pc.msg]);
  else if(r.otherProd.length) p.push(['bad','Ячейка '+r.cell+' занята другим товаром. Выберите другую ячейку.']);
  else if(!r.thisQty&&r.lotsIn.length>=cfg.maxLots) p.push(['bad','В ячейке '+r.cell+' уже '+r.lotsIn.length+' разные даты (максимум '+cfg.maxLots+'). Выберите другую ячейку.']);
  else if(!F.qty) p.push(['todo','Укажите количество коробок']);
  else if(!Number.isInteger(q)||q<1) p.push(['bad','Количество должно быть целым числом от 1']);
  else if(q>r.free) p.push(['bad','В ячейке '+r.cell+' свободно только '+r.free+' кор.']);
  r.problems=p; return r;
}

      else{ch.className='note';ch.innerHTML=BIG+'В ячейке: '+lines.map(esc).join('; ')+'. Свободно <b>'+free+'</b>'}
    }else if(pc.state==='err'){ch.className='note bad';ch.textContent=pc.msg}

    if(F.product){

      var sameSet={}; same.forEach(function(c){sameSet[c.cell]=1});

  var st=$('#inStatus'), btn=$('#inBtn');

    btn.disabled=!!pr||busy||!canSave();
    btn.textContent=busy?'Сохраняю…':'Положить в ячейку';
  }
}

function maskDate(v){var d=String(v).replace(/\D/g,'').slice(0,8); return d.slice(0,2)+(d.length>2?'.'+d.slice(2,4):'')+(d.length>4?'.'+d.slice(4):'')}
function parseDigits(s){
  var d=String(s).replace(/\D/g,''), dd, mm, yy;

var DAY=864e5;
function periodRange(){
  var t=today().getTime(), s=null, e=null;
  if(S.period==='today') s=t; else if(S.period==='3') s=t-2*DAY; else if(S.period==='7') s=t-6*DAY; else if(S.period==='30') s=t-29*DAY;
  else if(S.period==='custom'){ if(S.from) s=toDate(S.from).getTime(); if(S.to) e=toDate(S.to).getTime()+DAY; }
  return [s,e];
}
function periodLabel(){
  switch(S.period){
    case 'today': return 'сегодня';
    case '3': return 'за 3 дня';
    case '7': return 'за 7 дней';
    case '30': return 'за 30 дней';
    case 'custom': return (S.from||S.to)?('с '+(S.from?fmt(S.from):'начала')+' по '+(S.to?fmt(S.to):'сегодня')):'за выбранный период';
    default: return 'за всё время';

}

var PENCIL='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
function lotCellsOf(key){var g=D.lots.get(key);return g?g.cells.map(function(c){return c.cell}):[]}
function cellIssue(D2,code){
  var cm=D2.cells.get(code); if(!cm) return '';
  var ps={}, neg=false; cm.forEach(function(l){ps[l.product]=1; if(l.qty<0) neg=true});
  if(neg) return 'В ячейке '+code+' получится отрицательный остаток. Сначала отмените отгрузки из неё в журнале.';
  if(Object.keys(ps).length>1) return 'В ячейке '+code+' окажутся разные товары';
  if(cm.size>cfg.maxLots) return 'В ячейке '+code+' будет больше '+cfg.maxLots+' разных дат';
  var tot=cellTotal(D2,code), cap=capOf(cm.values().next().value.product);
  if(tot>cap) return 'В ячейке '+code+' получится '+tot+' кор., а лимит '+cap;
  return '';
}
/* Исправление правит исходные записи прихода: меняет товар и даты у всех записей даты в ячейке,
   а количество подгоняет по последним приходам. Первоначальные значения сохраняются в поле orig. */
function planEdit(ed){
  var res={ok:false,bad:false,msg:'',lines:[],patches:[],deletes:[]};
  var cm=D.cells.get(ed.cell), old=cm&&cm.get(ed.key);
  if(!old){res.bad=true;res.msg='Эта дата в ячейке изменилась. Закройте окно и откройте ячейку заново.';return res}
  if(!ed.product||!ed.prod||!ed.exp){res.msg='Укажите товар и обе даты';return res}
  if(ed.exp<=ed.prod){res.bad=true;res.msg='Срок годности раньше даты производства';return res}
  var q=Number(ed.qty);
  if(ed.qty===''||!Number.isInteger(q)||q<0){res.bad=true;res.msg='Количество: целое число от 0';return res}
  var nk=ed.product+'|'+ed.prod+'|'+ed.exp, relabel=nk!==ed.key;
  var newCell=ed.cell, cellChg=false;
  if(ed.to!==undefined&&ed.to!==ed.cell){
    var pcn=parseCell(ed.to);
    if(pcn.state==='partial'){res.msg='Введите ячейку: 5 цифр (ряд, секция, этаж)';return res}
    if(pcn.state==='err'){res.bad=true;res.msg=pcn.msg;return res}
    if(pcn.code!==ed.cell){newCell=pcn.code;cellChg=true}
  }
  if(cellChg&&relabel&&ed.scope==='lot'&&lotCellsOf(ed.key).length>1){res.msg='Чтобы сменить ячейку, выберите «Только здесь» в блоке про сроки';return res}
  var scope=[ed.cell];
  if(relabel&&ed.scope==='lot') lotCellsOf(ed.key).forEach(function(c){if(scope.indexOf(c)<0) scope.push(c)});
  var sim=moves.map(function(m){return Object.assign({},m)}), P={}, del={}, src=[], mvTo=[];
  sim.forEach(function(m){
    if(m.cell===ed.cell&&lotKey(m)===ed.key) src.push(m);
    if(m.type==='mv'&&m.to===ed.cell&&lotKey(m)===ed.key) mvTo.push(m);
    if(relabel&&(scope.indexOf(m.cell)>=0||(m.type==='mv'&&scope.indexOf(m.to)>=0))&&lotKey(m)===ed.key){
      var f=P[m.id]||(P[m.id]={}); f.product=ed.product; f.prod=ed.prod; f.exp=ed.exp;
      m.product=ed.product; m.prod=ed.prod; m.exp=ed.exp;
    }
  });
  if(cellChg){
    src.forEach(function(m){m.cell=newCell;(P[m.id]=P[m.id]||{}).cell=newCell});
    mvTo.forEach(function(m){m.to=newCell;(P[m.id]=P[m.id]||{}).to=newCell});
  }
  var diff=q-old.qty;
  if(diff!==0){
    var ins=src.filter(function(m){return (m.type==='in'||!m.type)&&m.qty>0}).sort(function(a,b){return String(b.ts||'').localeCompare(String(a.ts||''))});
    var NOIN='Эту дату нельзя поправить по приходу (она появилась перемещением или пересчётом). Количество исправьте кнопкой «Пересчитать» у ячейки.';
    if(!ins.length){res.bad=true;res.msg=NOIN;return res}
    if(diff>0){var m0=ins[0]; m0.qty+=diff; (P[m0.id]=P[m0.id]||{}).qty=m0.qty;}
    else{
      var rem=-diff;
      for(var i=0;i<ins.length&&rem>0;i++){
        var m1=ins[i], take=Math.min(rem,m1.qty);
        if(take===m1.qty){del[m1.id]=1;delete P[m1.id];m1.qty=0}
        else{m1.qty-=take;(P[m1.id]=P[m1.id]||{}).qty=m1.qty}
        rem-=take;
      }
      if(rem>0){res.bad=true;res.msg=NOIN;return res}
    }
  }
  var D2=derive(sim.filter(function(m){return !del[m.id]}));
  var byId={}; moves.forEach(function(m){byId[m.id]=m});
  var chk=scope.slice(); if(cellChg&&chk.indexOf(newCell)<0) chk.push(newCell);
  Object.keys(P).forEach(function(id){var m0=byId[id]; if(!m0) return; [m0.cell,m0.to].forEach(function(c){if(c&&chk.indexOf(c)<0) chk.push(c)})});
  for(var s=0;s<chk.length;s++){
    var issue=cellIssue(D2,chk[s]);
    if(issue){res.bad=true;res.msg=issue;return res}
  }
  Object.keys(P).forEach(function(id){
    if(del[id]) return;
    var m=byId[id], f=Object.assign({},P[id],{edited:true});
    if(!m.orig){f.orig={product:m.product,prod:m.prod,exp:m.exp,qty:m.qty,cell:m.cell}; if(m.to) f.orig.to=m.to}
    else if(f.cell!==undefined&&m.orig.cell===undefined) f.orig=Object.assign({},m.orig,{cell:m.cell});
    res.patches.push({id:id,fields:f});
  });
  res.deletes=Object.keys(del);
  if(!res.patches.length&&!res.deletes.length){res.msg='Измените хотя бы одно поле';return res}
  if(cellChg) res.lines.push('Ячейка: '+ed.cell+' → '+newCell+(cellDesc(newCell)?' (там уже: '+cellDesc(newCell)+')':''));
  if(ed.product!==old.product) res.lines.push('Товар: '+product(old.product).name+' → '+product(ed.product).name);
  if(ed.prod!==old.prod) res.lines.push('Произведено: '+fmt(old.prod)+' → '+fmt(ed.prod));
  if(ed.exp!==old.exp) res.lines.push('Годен до: '+fmt(old.exp)+' → '+fmt(ed.exp));
  if(q!==old.qty) res.lines.push('Количество: '+old.qty+' → '+q+' кор.'+(q===0?' (дата уйдёт из ячейки)':''));
  if(relabel&&scope.length>1) res.lines.push('Товар и сроки изменятся в ячейках: '+scope.join(', '));
  res.ok=true; return res;
}

function applyEdit(){

/* ---------- перемещение между ячейками ---------- */
function mvOpen(c){
  var cm=D.cells.get(c); if(!cm||!cm.size) return toast('В ячейке уже ничего нет',true);
  var l=Array.from(cm.values()).sort(byExp)[0];
  S.mv={cell:c,key:l.key,qty:String(l.qty),to:''}; renderSheet(); updateMove();
}
function planMove(e){
  var r={ok:false,bad:false,msg:''};
  var cm=D.cells.get(e.cell), l=cm&&cm.get(e.key);
  if(!l){r.bad=true;r.msg='Дата в ячейке изменилась. Закройте окно и откройте заново.';return r}
  if(e.qty===''){r.msg='Укажите, сколько коробок переместить';return r}
  var q=Number(e.qty);
  if(!Number.isInteger(q)||q<1){r.bad=true;r.msg='Количество: целое число от 1';return r}
  if(q>l.qty){r.bad=true;r.msg='В ячейке только '+l.qty+' кор.';return r}
  var pc=parseCell(e.to);
  if(pc.state==='partial'){r.msg='Введите ячейку назначения: 5 цифр (ряд, секция, этаж)';return r}
  if(pc.state==='err'){r.bad=true;r.msg=pc.msg;return r}
  if(pc.code===e.cell){r.bad=true;r.msg='Это та же ячейка. Укажите другую.';return r}
  var dm=D.cells.get(pc.code), dl=dm?Array.from(dm.values()):[];
  if(dl.some(function(x){return x.product!==l.product})){r.bad=true;r.msg='Ячейка '+pc.code+' занята другим товаром.';return r}
  if(!(dm&&dm.get(e.key))&&dl.length>=cfg.maxLots){r.bad=true;r.msg='В ячейке '+pc.code+' уже '+dl.length+' разные даты (максимум '+cfg.maxLots+').';return r}
  var cap=capOf(l.product), tot=cellTotal(D,pc.code);
  if(tot+q>cap){r.bad=true;r.msg='В ячейке '+pc.code+' свободно только '+Math.max(0,cap-tot)+' кор. (лимит '+cap+').';return r}
  r.ok=true; r.to=pc.code; r.q=q; r.lot=l;
  r.msg='Готово: '+q+' кор. '+e.cell+' → '+pc.code+(q===l.qty?'. Дата уйдёт из '+e.cell+' полностью.':'. В '+e.cell+' останется '+(l.qty-q)+' кор.');
  return r;
}
function renderMoveSheet(root){
  var e=S.mv, cm=D.cells.get(e.cell), lots=cm?Array.from(cm.values()).sort(byExp):[];
  var lotPick=lots.length>1?'<section class="group"><h2 class="lbl">Какую дату</h2><div class="choices">'+lots.map(function(l){
    return '<button type="button" class="choice pcol"'+pcol(l.product)+' data-act="mvLot" data-k="'+esc(l.key)+'" aria-pressed="'+(e.key===l.key)+'"><span>'+esc(product(l.product).short)+'<br><small>произв. '+fmt(l.prod)+' · до '+fmt(l.exp)+'</small></span><small>'+l.qty+' кор.</small></button>';
  }).join('')+'</div></section>':(lots[0]?'<p class="lede">'+pname(lots[0].product)+' · произв. '+fmt(lots[0].prod)+' · до '+fmt(lots[0].exp)+' · сейчас '+lots[0].qty+' кор.</p>':'');
  root.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Перемещение"><div class="wrap">'+
    '<div class="bar-top"><h1 style="margin:0;font-size:22px">Переместить</h1><button class="btn ghost sm" type="button" data-act="mvClose">Закрыть</button></div>'+
    '<div class="small" style="margin-bottom:4px">Откуда</div><div class="bigcode dim">'+esc(e.cell)+'</div>'+lotPick+
    '<section class="group"><div class="field"><label for="mvQty">Сколько коробок</label><div class="qrow"><input id="mvQty" type="number" inputmode="numeric" min="1" value="'+esc(e.qty)+'"><button class="btn ghost" type="button" data-act="mvAll">Все</button></div></div></section>'+
    '<section class="group"><div class="field"><label for="mvTo">Куда: ряд-секция-этаж</label><input id="mvTo" class="cellinp" type="text" inputmode="numeric" autocomplete="off" placeholder="10-01-3" value="'+esc(e.to)+'"></div><div class="bigcode" id="mvBig" style="margin-top:10px"></div><div id="mvHint" class="note"></div></section>'+
    '<div class="stack"><div id="mvStatus" class="status"></div><button id="mvSave" class="btn" type="button" data-act="mvSave">Переместить</button></div></div></div>';
}
function updateMove(){
  if(!S.mv) return;
  var e=S.mv, p=planMove(e), st=$('#mvStatus'), sv=$('#mvSave'); if(!st||!sv) return;
  var pc=parseCell(e.to), big=$('#mvBig'), hint=$('#mvHint');

    else{hint.className='note';hint.textContent=''}
  }

  sv.disabled=!p.ok||busy||!canSave(); sv.textContent=busy?'Сохраняю…':'Переместить';
}
function applyMove(){
  var p=planMove(S.mv); if(!p.ok||busy||!canSave()) return;
  busy=true; updateMove();
  var l=p.lot, from=S.mv.cell;
  addMove({type:'mv',product:l.product,prod:l.prod,exp:l.exp,cell:from,to:p.to,qty:p.q}).then(function(){
    busy=false; S.mv=null; renderSheet(); render(); toast('Перемещено '+p.q+' кор.: '+from+' → '+p.to);
  }).catch(function(er){busy=false;updateMove();toast(errText(er),true)});
}

/* ---------- инвентаризация (пересчёт ячейки) ---------- */
function invOpen(c){
  var cm=D.cells.get(c); if(!cm||!cm.size) return toast('В ячейке уже ничего нет',true);
  var vals={}; cm.forEach(function(l){vals[l.key]=String(l.qty)});
  S.inv={cell:c,vals:vals}; renderSheet(); updateInv();
}
function planInv(e){
  var cm=D.cells.get(e.cell); if(!cm||!cm.size) return {ok:false,bad:true,msg:'В ячейке уже ничего нет. Закройте окно.'};
  var ch=[], lines=[], bad='', tot=0, prod='';
  cm.forEach(function(l){
    var raw=e.vals[l.key], v=Number(raw);
    if(raw===undefined||raw===''||!Number.isInteger(v)||v<0){bad='Фактическое количество: целое число от 0';return}
    tot+=v; prod=l.product;
    if(v!==l.qty){ch.push({l:l,now:v});var d=v-l.qty;lines.push(esc(product(l.product).short)+' · до '+fmt(l.exp)+': '+l.qty+' → <b>'+v+'</b> ('+(d>0?'+':'−')+Math.abs(d)+')')}
  });
  if(bad) return {ok:false,bad:true,msg:bad};
  var cap=capOf(prod), over=tot>cap?'<br>Внимание: больше лимита ячейки ('+cap+'). Ячейка будет отмечена как переполненная.':'';
  if(!ch.length) return {ok:true,ch:ch,html:'Всё совпадает с учётом. Ячейка будет отмечена как пересчитанная.'};
  return {ok:true,ch:ch,html:lines.join('<br>')+over};
}
function renderInvSheet(root){
  var e=S.inv, cm=D.cells.get(e.cell), lots=cm?Array.from(cm.values()).sort(byExp):[];
  root.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Пересчёт ячейки"><div class="wrap">'+
    '<div class="bar-top"><h1 style="margin:0;font-size:22px">Пересчёт ячейки</h1><button class="btn ghost sm" type="button" data-act="invClose">Закрыть</button></div>'+
    '<div class="bigcode">'+esc(e.cell)+'</div>'+
    '<p class="lede">Посчитайте коробки в ячейке и впишите, сколько их на самом деле. Расхождение запишется в журнал.</p>'+
    lots.map(function(l){
      var li=lotInfo(l);
      return '<section class="card prod" style="margin-bottom:12px"><div class="lot"><div class="lot-top"><div><b>'+pname(l.product)+'</b>'+datesHtml(l)+'</div><div class="lot-qty">по учёту<br><b>'+l.qty+'</b> кор.</div></div>'+
        '<div><span class="pill lv"'+lvAttr(li)+'>'+(li.left<0?'срок истёк · 0%':'осталось '+fp(li.pct)+'% срока')+'</span></div>'+
        '<div class="field"><label>Фактически, коробок</label><div class="qrow"><input class="invin" type="number" inputmode="numeric" min="0" data-k="'+esc(l.key)+'" value="'+esc(e.vals[l.key])+'" aria-label="Фактически коробок"><button class="btn ghost" type="button" data-act="invSame" data-k="'+esc(l.key)+'">Как в учёте</button></div></div></div></section>';
    }).join('')+
    '<div class="stack"><div id="invStatus" class="status"></div><button id="invSave" class="btn" type="button" data-act="invSave">Сохранить пересчёт</button></div></div></div>';

function updateInv(){
  if(!S.inv) return;
  var p=planInv(S.inv), st=$('#invStatus'), sv=$('#invSave'); if(!st||!sv) return;
  st.className='status'+(p.bad?' bad':p.ok&&p.ch.length?' ok':''); 
  if(p.msg) st.textContent=p.msg; else st.innerHTML=p.html;
  sv.disabled=!p.ok||busy||!canSave(); sv.textContent=busy?'Сохраняю…':(p.ok&&p.ch.length?'Записать расхождение':'Подтвердить: всё совпало');

function applyInv(){
  var p=planInv(S.inv); if(!p.ok||busy||!canSave()) return;
  var _d=0; (p.ch||[]).forEach(function(x){_d+=Math.abs(x.now-x.l.qty)}); if(cfg.bigOn!==false&&cfg.bigAdj>0&&_d>=cfg.bigAdj&&!askWarn(['пересчёт меняет остаток на '+_d+' кор. — '+bigTxt(_d)])) return;
  busy=true; updateInv();
  var cell=S.inv.cell, cm=D.cells.get(cell), recs=[];
  if(p.ch.length) p.ch.forEach(function(x){recs.push({type:'adj',product:x.l.product,prod:x.l.prod,exp:x.l.exp,cell:cell,qty:x.now-x.l.qty,prev:x.l.qty,now:x.now})});
  else{var f=Array.from(cm.values())[0]; recs.push({type:'adj',product:f.product,prod:f.prod,exp:f.exp,cell:cell,qty:0,prev:f.qty,now:f.qty})}
  var n=0;
  recs.reduce(function(pr,r){return pr.then(function(){return addMove(r).then(function(){n++})})},Promise.resolve()).then(function(){
    busy=false; S.inv=null; renderSheet(); render(); toast(p.ch.length?'Пересчёт записан: '+cell:'Ячейка '+cell+' пересчитана, всё совпало');
  }).catch(function(er){busy=false;updateInv();toast((n?'Записано '+n+' из '+recs.length+'. ':'')+errText(er),true)});
}



/* ---------- карта стеллажа ---------- */
function mapTile(code,M){
  var cm=D.cells.get(code);
  if(!cm||!cm.size) return '<button type="button" class="mt empty" data-act="mapCell" data-cell="'+code+'" aria-label="Ячейка '+code+', пусто"></button>';
  var lots=Array.from(cm.values()), tot=cellTotal(D,code), p0=lots[0].product, cap=capOf(p0), f=Math.min(100,tot/cap*100), color;
  if(M.mode==='shelf'){var wl=lots.slice().sort(function(a,b){return lotInfo(a).pct-lotInfo(b).pct})[0]; color=lotInfo(wl).color}
  else if(M.mode==='fill') color=tot>cap?'var(--bad)':tot>=cap?'var(--ok)':'var(--accent)';
  else{var pp=cfg.products.filter(function(x){return x.id===p0})[0]; color=pp&&pp.color?pp.color:'#8A94A6'}
  var dim=M.pf!=='all'&&!lots.some(function(l){return l.product===M.pf});
  var bad=!!cellIssue(D,code);
  return '<button type="button" class="mt'+(dim?' dim':'')+(bad?' bad':'')+'" data-act="mapCell" data-cell="'+code+'" style="--c:'+color+';--f:'+f.toFixed(0)+'%" aria-label="Ячейка '+code+', '+tot+' из '+cap+' коробок"><i></i><b>'+tot+'</b>'+(lots.length>1?'<u>'+lots.length+'</u>':'')+'</button>';
}
function mapLegend(M){
  if(M.mode==='shelf') return legendHtml();
  if(M.mode==='fill') return '<div class="legend">Заполнение: <span><i style="--c:var(--accent)"></i>есть место</span><span><i style="--c:var(--ok)"></i>полная</span><span><i style="--c:var(--bad)"></i>больше лимита</span></div>';
  return '<div class="legend">Цвет товара: '+cfg.products.map(function(p){return '<span><i style="--c:'+esc(p.color||'#8A94A6')+'"></i>'+esc(p.short)+'</span>'}).join('')+'</div>';

function renderMap(){

  h+='</div>';

  });
  h+='</div>';

  h+='<p class="mapsum">Ряд '+M.row+': занято <b>'+rowCodes+'</b> из <b>'+rowTotal+'</b> ячеек · коробок <b>'+boxes+'</b>. Слева этажи, сверху номера секций.</p>';
  h+='<div class="mapcolor">'+mapLegend(M)+'</div>';
  h+='<p class="note">Нажмите на ячейку, чтобы увидеть, что в ней, или положить товар в пустую. Цифра в плитке — коробок, маленькая цифра в углу — сколько дат в ячейке, красная рамка — проблема в ячейке.</p>';
  return h;

/* ---------- ожидаемые приходы ---------- */
function plansOpen(){return moves.filter(function(m){return m.type==='plan'&&m.status==='open'}).sort(function(a,b){return String(a.eta||'9999').localeCompare(String(b.eta||'9999'))||tsAsc(a,b)})}
function setPlan(id,f){return withRetry(function(){return db.doc('moves/'+id).update(f)})}
function sourcesList(){var c={};moves.forEach(function(m){if(m.from) c[m.from]=(c[m.from]||0)+1});return Object.keys(c).sort(function(a,b){return c[b]-c[a]||(a<b?-1:1)})}
function srcAdmHtml(){
  var c={}; moves.forEach(function(m){if(m.from&&kindOf(m)==='in') c[m.from]=(c[m.from]||0)+1});
  var list=Object.keys(c).sort(function(a,b){return c[b]-c[a]||(a<b?-1:1)});
  if(!list.length) return '<p class="note">Пока нет приходов с указанным источником.</p>';
  return '<div class="srcadm">'+list.map(function(s){
    if(S.srcRen===s) return '<div class="srow ed"><input id="srcRenIn" type="text" value="'+esc(s)+'" aria-label="Новое название источника" autocomplete="off"><button class="btn sm" type="button" data-act="srcRenSave">Сохранить</button><button class="btn ghost sm" type="button" data-act="srcRenNo">Отмена</button></div>';
    return '<div class="srow"><span class="sn2">'+esc(s)+'</span><span class="sc">'+c[s]+' зап.</span><button class="btn ghost sm" type="button" data-act="srcRen" data-s="'+esc(s)+'"'+(canSave()?'':' disabled')+'>Изменить</button></div>';
  }).join('')+'</div>';
}
function srcRenameAll(oldN,newN){
  var list=moves.filter(function(m){return m.from===oldN});
  var chunks=[],i; for(i=0;i<list.length;i+=400) chunks.push(list.slice(i,i+400));
  return chunks.reduce(function(p,ch){return p.then(function(){
    var b=db.batch(); ch.forEach(function(m){b.update(db.doc('moves/'+m.id),{from:newN})}); return b.commit();

/* PDF собирается прямо в программе: страницы рисуются как картинки и складываются в файл. Окно печати не нужно. */
var PG_W=794, PG_H=1123, PG_M=42;
function paginate(html){
  var CW=PG_W-2*PG_M, CH=PG_H-2*PG_M;
  var stage=document.createElement('div'); stage.style.cssText='position:fixed;left:-20000px;top:0;visibility:hidden;width:'+CW+'px';
  document.body.appendChild(stage);
  var src=document.createElement('div'); src.innerHTML=html;
  var pages=[], cur=null, lead=[];
  function newPage(){cur=document.createElement('div');cur.className='rpt pg';cur.style.width=CW+'px';stage.appendChild(cur);pages.push(cur)}
  function fits(){return cur.offsetHeight<=CH}
  function moveNew(nodes){nodes.forEach(function(n){if(n.parentNode)n.parentNode.removeChild(n)});newPage();nodes.forEach(function(n){cur.appendChild(n)})}
  function addTable(el){
    var thead=el.querySelector('thead'), rows=Array.prototype.slice.call(el.querySelectorAll('tbody tr')), foot=Array.prototype.slice.call(el.querySelectorAll('tfoot tr'));
    var mk=function(){var t=document.createElement('table');t.appendChild(thead.cloneNode(true));var tb=document.createElement('tbody');t.appendChild(tb);return {t:t,tb:tb,n:0}};
    var T=mk(); cur.appendChild(T.t);
    rows.concat(foot).forEach(function(r){
      var c=r.cloneNode(true); if(foot.indexOf(r)>=0) c.className='tf';
      T.tb.appendChild(c); T.n++;
      if(!fits()){
        T.tb.removeChild(c); T.n--;
        if(T.n===0){moveNew(lead.concat([T.t]));lead=[]}
        else{newPage();T=mk();cur.appendChild(T.t)}
        T.tb.appendChild(c); T.n++;
      }
    });
  }
  newPage();
  Array.prototype.slice.call(src.children).forEach(function(el){
    var tag=el.tagName;
    if(tag==='TABLE'){addTable(el);lead=[];return}
    var c=el.cloneNode(true); cur.appendChild(c);
    if(tag==='H2'||tag==='H3'){lead.push(c);return}
    if(!fits()&&cur.children.length>1) moveNew(lead.concat([c]));
    lead=[];
  });
  var out=pages.map(function(pg){var d=pg.cloneNode(true);d.style.width=CW+'px';return new XMLSerializer().serializeToString(d)});
  document.body.removeChild(stage);
  return out;
}
function pageJpeg(inner,idx,total){

function iePlan(){
  var e=S.ie, m=moves.filter(function(x){return x.id===e.id})[0], f={};
  if(!m) return {ok:false,bad:true,msg:'Запись не найдена'};
  if(e.mode==='date'){
    if(!e.prod||!e.exp) return {ok:false,msg:'Укажите обе даты'};
    if(e.exp<=e.prod) return {ok:false,bad:true,msg:'Срок годности раньше даты производства'};
    if(e.prod===m.prod&&e.exp===m.exp) return {ok:false,msg:'Измените хотя бы одну дату'};
    f.prod=e.prod; f.exp=e.exp;
  }else{
    var q=Number(e.qty);
    if(e.qty===''||!Number.isInteger(q)||q<1) return {ok:false,bad:true,msg:'Количество: целое число от 1. Чтобы убрать приход целиком, нажмите «Отменить».'};
    if(q===m.qty) return {ok:false,msg:'Укажите другое количество'};
    f.qty=q;

function mapTile2(code,M){

var KNOWN=null, NQ=[], NT=null;
function notifyNew(first){
  if(first||!KNOWN){
    KNOWN={}; var back=[], ps=ME&&ME.prevSeen?Date.parse(ME.prevSeen):0;
    var since=Math.max(Date.now()-7*86400000, isFinite(ps)&&ps?ps:Date.now()-86400000);
    moves.forEach(function(m){
      KNOWN[m.id]=1;
      if(!ME||!m.by||m.by===ME.uid) return;
      var k=kindOf(m); if(k!=='in'&&k!=='out') return;
      var t=Date.parse(m.ts); if(isFinite(t)&&t>since) back.push(m);
    });
    if(back.length&&UI.notif!=='0'){NQ=back; flushNotif(true)}
    return;
  }
  var fresh=[];
  moves.forEach(function(m){
    if(KNOWN[m.id]) return; KNOWN[m.id]=1;
    if(!ME||!m.by||m.by===ME.uid) return;
    var k=kindOf(m); if(k!=='in'&&k!=='out') return;
    var t=Date.parse(m.ts); if(!isFinite(t)||Date.now()-t>600000) return;
    fresh.push(m);
  });
  if(!fresh.length||UI.notif==='0') return;
  NQ=NQ.concat(fresh); clearTimeout(NT); NT=setTimeout(flushNotif,1800);
}
function flushNotif(backlog){
  var g={}, order=[];
  NQ.forEach(function(m){
    var k=[m.by,kindOf(m),m.product,kindOf(m)==='out'?m.city:m.from].join('|');
    if(!g[k]){g[k]={m:m,cells:{},sum:0,last:m.ts};order.push(k)}
    var o=g[k], q=Number(m.qty)||0; o.sum+=q; o.cells[m.cell]=(o.cells[m.cell]||0)+q; if(String(m.ts)>String(o.last)) o.last=m.ts;
  });
  NQ=[];
  order.sort(function(a,b){return String(g[b].last).localeCompare(String(g[a].last))});
  var extra=0;
  if(backlog&&order.length>4){extra=order.length-3; order=order.slice(0,3)}
  order.forEach(function(k){
    var o=g[k], m=o.m, out=kindOf(m)==='out';
    var cells=Object.keys(o.cells).sort().map(function(c){return c+' ('+o.cells[c]+')'}).join(', ');
    var who=m.byLogin||m.byName||'сотрудник';
    showNf(backlog?o.last:'', backlog, 'Сотрудник «'+who+'» '+(out?'отгрузил':'принял приход')+' '+o.sum+' кор. · '+product(m.product).short+(out?' → '+(m.city||'?')+'. Из ячеек: ':'. В ячейки: ')+cells);
  });
  if(extra) showNf('',true,'Ещё '+extra+' действий других сотрудников за время вашего отсутствия. Подробности в журнале.');
}
function showNf(whenIso,sticky,txt){
  var r=document.getElementById('nfRoot'); if(!r) return;
  var hd=document.querySelector('.hd'); r.style.top=(hd?Math.max(0,Math.round(hd.getBoundingClientRect().bottom))+6:8)+'px';
  var d=document.createElement('div'); d.className='nf'; d.setAttribute('role','status');
  var t=new Date(), hm=whenIso?whenText(whenIso):pad(t.getHours())+':'+pad(t.getMinutes());
  d.innerHTML='<span class="nf-t">'+esc(txt)+'</span><span class="nf-w">'+hm+'</span><button type="button" data-act="nfClose" aria-label="Закрыть уведомление">×</button>';
  r.appendChild(d);
  while(r.children.length>5) r.removeChild(r.firstChild);
  try{if(navigator.vibrate) navigator.vibrate(120)}catch(e){}
  setTimeout(function(){if(d.parentNode) d.parentNode.removeChild(d)},sticky?45000:20000);
}
/* ---- проверка отгрузки ---- */
function chkHtml(m){
  var dis=canSave()?'':' disabled', id=esc(m.id), inn=kindOf(m)==='in';
  var b1='<button type="button" class="ck ok" data-act="chk" data-v="ok" data-id="'+id+'" aria-pressed="'+(m.chk==='ok')+'" aria-label="'+(inn?'Заблокировано':'Взято с ячейки')+'"'+dis+'>✓</button>';
  var b2='<button type="button" class="ck bad" data-act="chk" data-v="bad" data-id="'+id+'" aria-pressed="'+(m.chk==='bad')+'" aria-label="'+(inn?'Разблокировано':'Не взято с ячейки')+'"'+dis+'>✕</button>';
  if(inn) return '<span class="ckwrap"><span class="cklab">ЯЧЕЙКА</span><span class="ckrow" role="group" aria-label="Блокировка ячейки прихода"><span class="ckc">'+b1+'<small>заблок.</small></span><span class="ckc">'+b2+'<small>разблок.</small></span></span></span>';
  return '<span class="ckwrap"><span class="cklab">С ЯЧЕЙКИ</span><span class="ckrow" role="group" aria-label="Взято с ячейки"><span class="ckc">'+b1+'<small>взято</small></span><span class="ckc">'+b2+'<small>не взято</small></span></span></span>';
}
function chkNote(m){
  var k=kindOf(m); if((k!=='out'&&k!=='in')||!m.chk) return '';
  var t=k==='in'?(m.chk==='ok'?'✓ Заблокировано':'✕ Разблокировано'):(m.chk==='ok'?'✓ Взято с ячейки':'✕ Не взято с ячейки');
  return '<div class="mv-s">'+t+(m.chkByName?': '+esc(m.chkByName):'')+(m.chkAt?' · '+esc(whenText(m.chkAt)):'')+'</div>';
}
function jShipCard(g){
  var st=nabState(g), k=esc(g.key);
  return '<li class="card jsc"><div class="jh"><span class="jwho">Отгрузил <b>'+esc(g.who||'—')+'</b> · '+timeKey(g.ts)+'</span><span class="mvpill">в '+esc(g.city)+'</span></div>'+
    '<div class="jp">'+pname(g.product)+'<span class="jq"><b>'+g.qty+'</b> кор</span></div>'+
    '<span class="pst '+st[0]+'">'+esc(st[1])+'</span>'+
    '<div class="jls">'+g.items.map(function(m){return '<div class="jl"><span class="mono">'+esc(m.cell)+'</span><span class="jd">'+rng(m.prod,m.exp)+'</span><span class="jn"><b>'+(Number(m.qty)||0)+'</b> кор</span></div>'}).join('')+'</div>'+
    (canSave()?(S.confirmGrp===g.key?'<div class="mv-a jfoot"><span class="note">Отменить всю отгрузку ('+g.qty+' кор)?</span><button class="btn danger sm" type="button" data-act="grpDelYes" data-k="'+k+'">Да, отменить</button><button class="btn ghost sm" type="button" data-act="grpDelNo">Нет</button></div>'
      :'<div class="jfoot"><button class="linkbtn jcancel" type="button" data-act="grpDelAsk" data-k="'+k+'">Отменить отгрузку</button></div>'):'')+'</li>';
}
function chkSum(list,type){
  if(type==='out'){var gs=shipGroups(list), d=gs.filter(function(g){return g.done===g.total}).length; return '<p class="sumtxt" style="margin-top:-2px">Набрано: '+d+' из '+gs.length+' отгрузок</p>'}
  var ok=0,bad=0; list.forEach(function(m){if(m.chk==='ok')ok++;else bad++});
  var n=list.length-ok-bad;
  return '<p class="sumtxt" style="margin-top:-2px">'+(type==='in'?'Заблок.: ✓ '+ok+' · Разблок.: ✕ '+bad:'Взято с ячейки: ✓ '+ok+' · Не взято: ✕ '+bad)+'</p>';
}
/* ---- новая ячейка с товаром ---- */
function ncState(){return {product:'',prod:'',exp:'',cell:'',qty:''}}
function checkNew(N){
  var sv=F; F=Object.assign({total:'',placed:0,from:'',planId:'',noFrom:true},N);
  try{return checkIn()}finally{F=sv}
}
function renderNcSheet(root){
  var e=S.nc;
  root.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Новая ячейка с товаром"><div class="wrap">'+
    '<div class="bar-top"><h1 style="margin:0;font-size:22px">Новая ячейка с товаром</h1><button class="btn ghost sm" type="button" data-act="ncClose">Закрыть</button></div>'+
    '<p class="lede">Добавьте товар, который уже лежит в ячейке, но ещё не записан в программе. В журнале запись появится в разделе «Прочее» с пометкой «добавлено вручную». Новую поставку лучше вносить на вкладке «Приход».</p>'+
    '<section class="group"><h2 class="lbl">Товар</h2><div class="choices">'+cfg.products.map(function(p){return '<button type="button" class="choice pcol"'+pcol(p.id)+' data-act="ncProduct" data-id="'+esc(p.id)+'" aria-pressed="'+(e.product===p.id)+'"><span>'+esc(p.name)+'</span></button>'}).join('')+'</div></section>'+
    '<section class="group"><div class="two"><div class="field"><label for="ncProd">Дата производства</label><input id="ncProd" type="date" value="'+esc(e.prod)+'"></div><div class="field"><label for="ncExp">Годен до</label><input id="ncExp" type="date" value="'+esc(e.exp)+'"></div></div><div id="ncShelf" class="note" style="margin-top:8px"></div></section>'+
    '<section class="group"><div class="field"><label for="ncCell">Ячейка: ряд-секция-этаж</label><input id="ncCell" class="cellinp" type="text" inputmode="numeric" autocomplete="off" placeholder="10-01-3" value="'+esc(e.cell)+'"></div><div id="ncHint" class="note" style="margin-top:8px"></div></section>'+
    '<section class="group"><div class="field"><label for="ncQty">Сколько коробок в ячейке</label><input id="ncQty" type="number" inputmode="numeric" min="1" value="'+esc(e.qty)+'"></div></section>'+
    '<div class="stack"><div id="ncStatus" class="status"></div><button id="ncSave" class="btn" type="button" data-act="ncSave">Добавить в ячейку</button></div></div></div>';
}
function updateNc(){
  if(!S.nc) return;
  var e=S.nc, r=checkNew(e), st=document.getElementById('ncStatus'), sv=document.getElementById('ncSave'); if(!st||!sv) return;
  var sh=document.getElementById('ncShelf');
  if(sh){
    if(e.prod&&e.exp&&e.exp>e.prod){var li=lotInfo({prod:e.prod,exp:e.exp});sh.className='note'+(li.cls==='ok'?'':' '+li.cls);sh.innerHTML='Срок годности <b>'+li.life+' дн.</b> · осталось <b>'+fp(li.pct)+'%</b>'}
    else{sh.className='note';sh.innerHTML=''}
    shelfPaint(sh,e.prod,e.exp);
  }
  var ch=document.getElementById('ncHint');
  if(ch){
    var pc=parseCell(e.cell);
    if(pc.state==='ok'){
      var lines=describeCell(pc.code);
      ch.className='note'+(r.otherProd.length?' bad':' ok');
      ch.innerHTML=lines?'В ячейке <b>'+pc.code+'</b> уже: '+lines.map(esc).join('; ')+'. Свободно <b>'+Math.max(0,r.free)+'</b>':'Ячейка <b>'+pc.code+'</b> пустая, свободно '+r.cap+' кор.';
    }else if(pc.state==='err'){ch.className='note bad';ch.textContent=pc.msg}
    else{ch.className='note';ch.textContent='Цифры без дефисов: 10013 превратится в 10-01-3.'}
  }
  if(r.problems.length){var p0=r.problems[0]; st.className='status'+(p0[0]==='bad'?' bad':''); st.textContent=p0[1]; sv.disabled=true}
  else{st.className='status ok'; st.textContent='Будет добавлено '+r.q+' кор. в ячейку '+r.cell; sv.disabled=busy||!canSave()}
  sv.textContent=busy?'Сохраняю…':'Добавить в ячейку';
}
function saveNc(){
  var e=S.nc, r=checkNew(e); if(!e||r.problems.length||busy||!canSave()) return;
  busy=true; updateNc();
  var prev=r.thisQty;
  addMove({type:'adj',manual:true,product:e.product,prod:e.prod,exp:e.exp,cell:r.cell,qty:r.q,prev:prev,now:prev+r.q}).then(function(){
    busy=false; S.nc=null; renderSheet(); render(); toast('Добавлено '+r.q+' кор. → '+r.cell);
  }).catch(function(er){busy=false;updateNc();toast(errText(er),true)});
}

function isToday(m){return m.ts&&dayKey(m.ts)===dayKey(new Date().toISOString())}
function tdCls(m){var k=kindOf(m); return (k==='out'||k==='in')&&isToday(m)?' td-'+k:''}
function tdTag(m){var k=kindOf(m); if(!((k==='out'||k==='in')&&isToday(m))) return ''; return '<span class="tdtag">'+(k==='out'?'Сегодняшняя отгрузка':'Сегодняшний приход')+'</span>'}

function calcDef(){return {prod:'',exp:'',months:''}}
function addMonthsIso(iso,n){
  var p=iso.split('-').map(Number), d0=new Date(p[0],p[1]-1+n,1);
  var last=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate(); d0.setDate(Math.min(p[2],last));
  return d0.getFullYear()+'-'+pad(d0.getMonth()+1)+'-'+pad(d0.getDate());
}
function renderCalcSheet(root){
  var c=S.calc;
  root.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Калькулятор срока"><div class="wrap">'+
    '<div class="bar-top"><h1 style="margin:0;font-size:22px">Калькулятор срока</h1><button class="btn ghost sm" type="button" data-act="calcClose">Закрыть</button></div>'+
    '<p class="lede">Введите дату производства и срок годности: покажу общий срок, сколько прошло и сколько осталось, в днях и процентах.</p>'+
    '<section class="group"><div class="two"><div class="field"><label for="calcProd">Дата производства</label><input id="calcProd" type="date" value="'+esc(c.prod)+'"></div><div class="field"><label for="calcExp">Годен до</label><input id="calcExp" type="date" value="'+esc(c.exp)+'"></div></div>'+
    '<div class="field" style="margin-top:12px"><label for="calcMonths">Или срок годности в месяцах <span class="opt">если даты «годен до» нет</span></label><input id="calcMonths" type="number" inputmode="numeric" min="1" max="120" placeholder="например 9" value="'+esc(c.months)+'"></div></section>'+
    '<div id="calcOut" class="calcres"></div></div></div>';
}
function updateCalc(){
  var out=document.getElementById('calcOut'); if(!S.calc||!out) return;
  var c=S.calc, exp=c.exp, from='';
  var mo=Number(c.months);
  if(!exp&&c.prod&&mo>=1&&Number.isInteger(mo)&&mo<=120){exp=addMonthsIso(c.prod,mo); from='Годен до по сроку '+mo+' мес.: <b>'+fmt(exp)+'</b>'}
  if(!c.prod||!exp){out.innerHTML='<p class="note">Укажите дату производства и срок годности (дату «годен до» или число месяцев).</p>';return}
  if(exp<=c.prod){out.innerHTML='<div class="status bad">Срок годности раньше даты производства или равен ей.</div>';return}
  var life=daysBetween(c.prod,exp), left=daysTo(exp), passed=-daysTo(c.prod);
  var li=lotInfo({prod:c.prod,exp:exp}), exact=Math.max(0,Math.min(100,left/life*100)), fx=function(v){return v.toFixed(1).replace('.',',')};
  var mon=(life/30.4375).toFixed(1).replace('.',',');
  var h=(from?'<p class="sumtxt">'+from+'</p>':'');
  h+='<div class="stats"><div class="stat"><b>'+life+'</b><span>дн. общий срок (≈ '+mon+' мес.)</span></div>'+
     '<div class="stat"><b>'+Math.max(0,Math.min(life,passed))+'</b><span>дн. прошло · '+(passed<0?'0':fx(Math.max(0,Math.min(100,passed/life*100))))+'%</span></div>'+
     '<div class="stat'+(left<0?' warn':'')+'"><b>'+Math.max(0,left)+'</b><span>дн. осталось · '+fx(exact)+'%</span></div></div>';
  h+='<p class="sumtxt"><span class="pill lv"'+lvAttr(li)+'>'+(left<0?'Срок истёк '+(-left)+' дн. назад · 0%':'Остаточный срок '+fp(li.pct)+'%')+'</span></p>';
  if(passed<0) h+='<p class="note">Дата ещё не произведена: до даты производства '+(-passed)+' дн.</p>';
  h+='<div class="bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,exact))+'%"></i></div><p class="note" style="margin-top:8px">Остаточный срок считается как доля оставшихся дней от общего срока и показывается с точностью до 0,1%.</p>';
  out.innerHTML=h;
}
function boot(){
  if(BAKED_CFG) return startFirebase(BAKED_CFG);
  var raw=null; try{raw=localStorage.getItem(LS_FB)}catch(e){}
  if(raw){try{return startFirebase(JSON.parse(raw))}catch(e){}}
  fetch('/__/firebase/init.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){if(!o||!o.apiKey)throw 0;startFirebase(o)}).catch(function(){screenConfig()});
}
boot();
})();
